<!--
  기사 뼈대 v1 — 오늘의 제일기획 뉴스
  이 파일이 디자인의 SOT다. 매일판은 이 뼈대에 슬롯만 채운다.
  CSS는 수정하지 말고, 주제에 따라 슬롯을 넣고 빼는 것으로 재배열한다.

  고정 원칙
  - body 는 word-break:keep-all — 한국어 어절 단위 줄바꿈. 지우면 제목이 음절에서 꺾인다
  - .dartview / .irview 는 원문 재현 구역 — color-scheme:light 고정. 문서 테마를 따라가면 원문으로 인지되지 않는다
  - .dartview 첫 열은 sticky — 모바일 가로 스크롤에서 계정과목이 화면에 남는다
  - 계산해 넣은 열은 반드시 노란(--calc-bg) 배경 + "계산 추가" 표기
  - 헤드라인·리드의 숫자는 ledger 문자열만. 파생값은 본문 계산 자리에서만
-->
<title>[[화두 — 의문형]] — 오늘의 제일기획 뉴스</title>
<style>
:root{
  --ground:#f6f5f1; --surface:#ffffff; --ink:#1b1b18; --ink-soft:#5c5b53;
  --rule:#dedbd2; --rule-strong:#b9b5a8; --head:#ece9e1;
  --ok-bg:#c9f5b0; --ok-ink:#14532d; --ok-line:#5aa33c;
  --warn-bg:#ffd9a0; --warn-ink:#7c3f0a; --warn-line:#b45309;
  --new-bg:#ddd6fe; --new-ink:#4c1d95; --new-line:#7c5cd6;
  --calc-bg:#fffbe6; --calc-line:#b45309;
  --serif:Georgia,"Batang","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",Consolas,"D2Coding",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#17171a; --surface:#1f1f23; --ink:#eceae4; --ink-soft:#a3a099;
  --rule:#33333a; --rule-strong:#4c4c55; --head:#26262c;
  --ok-bg:#28511f; --ok-ink:#c9f5b0; --ok-line:#5aa33c;
  --warn-bg:#5e3309; --warn-ink:#ffd9a0; --warn-line:#d97706;
  --new-bg:#3b2a63; --new-ink:#ddd6fe; --new-line:#8b6ee0;
  --calc-bg:#2b2718; --calc-line:#d97706;
}}
:root[data-theme="dark"]{
  --ground:#17171a; --surface:#1f1f23; --ink:#eceae4; --ink-soft:#a3a099;
  --rule:#33333a; --rule-strong:#4c4c55; --head:#26262c;
  --ok-bg:#28511f; --ok-ink:#c9f5b0; --ok-line:#5aa33c;
  --warn-bg:#5e3309; --warn-ink:#ffd9a0; --warn-line:#d97706;
  --new-bg:#3b2a63; --new-ink:#ddd6fe; --new-line:#8b6ee0;
  --calc-bg:#2b2718; --calc-line:#d97706;
}
:root[data-theme="light"]{
  --ground:#f6f5f1; --surface:#ffffff; --ink:#1b1b18; --ink-soft:#5c5b53;
  --rule:#dedbd2; --rule-strong:#b9b5a8; --head:#ece9e1;
  --ok-bg:#c9f5b0; --ok-ink:#14532d; --ok-line:#5aa33c;
  --warn-bg:#ffd9a0; --warn-ink:#7c3f0a; --warn-line:#b45309;
  --new-bg:#ddd6fe; --new-ink:#4c1d95; --new-line:#7c5cd6;
  --calc-bg:#fffbe6; --calc-line:#b45309;
}

*{box-sizing:border-box}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px;display:flex;flex-direction:column;gap:46px}

.masthead{border-top:3px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:13px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.6vw,42px);line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.01em}
.standfirst{font-size:17px;color:var(--ink-soft);max-width:62ch;margin:0}
.standfirst b{color:var(--ink);font-weight:600}

section{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--serif);font-weight:400;font-size:23px;margin:0;padding-bottom:9px;border-bottom:1px solid var(--rule-strong);display:flex;align-items:baseline;gap:11px;text-wrap:balance}
h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.1em}
h3{font-family:var(--sans);font-weight:650;font-size:15px;margin:0}
p{margin:0;max-width:66ch}
.note{font-size:13.5px;color:var(--ink-soft);max-width:66ch}

.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:9px;vertical-align:middle;white-space:nowrap}
.c-new{background:var(--new-bg);color:var(--new-ink)}
.c-warn{background:var(--warn-bg);color:var(--warn-ink)}
/* ── DART 주석 화면 재현 블록 (문서 원본 재현이라 라이트 고정) ── */
.dartview{color-scheme:light;background:#fff;color:#000;border:1px solid #c9c9c9;padding:16px 14px 12px;overflow-x:auto;
  font-family:"돋움",Dotum,"맑은 고딕","Malgun Gothic",sans-serif}
.dartview .dt{text-align:center;font-size:12px;margin:0;line-height:1.75;color:#000}
.dartview .unit{text-align:right;font-size:11px;margin:6px 0 7px;color:#000}
.dartview table{border-collapse:collapse;width:100%;min-width:820px;font-size:11px;font-variant-numeric:tabular-nums}
.dartview th,.dartview td{border:1px solid #b0b0b0;padding:3px 6px;line-height:1.35;color:#000;background:#fff;text-align:left}
.dartview thead th{background:#efefef;font-weight:700;text-align:center;white-space:nowrap}
.dartview td.n{text-align:right;white-space:nowrap}
.dartview tr.g td{background:#c9f5b0}
.dartview tr.r td{background:#ffd9a0}
.dartview th.aH{background:#fde68a;text-align:center}
.dartview th.aH.lft,.dartview td.aC.lft{border-left:2px solid #b45309}
.dartview td.aC{background:#fffbe6;text-align:right;font-weight:800;white-space:nowrap}
.dartview .up{color:#166534}
.dartview .dn{color:#b91c1c}
.dartview .i1{padding-left:20px}
.dartview .i2{padding-left:34px}
.dartview .bg{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:11px;background:#1f7a34;color:#fff;font-size:10px;font-weight:800;vertical-align:middle;white-space:nowrap}
.dartview .bg.r2{background:#b45309}
.srcline{font-family:var(--mono);font-size:12px;color:var(--ink-soft);line-height:1.55}
/* ── 제일기획 IR 실적발표자료 재현 블록 (라이트 고정) ── */
.irview{color-scheme:light;background:#fff;color:#000;border:1px solid #c9c9c9;padding:16px 14px 12px;overflow-x:auto;
  font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif}
.irview .ttl{font-size:14px;font-weight:800;color:#1f3864;border-bottom:2px solid #1f3864;padding:0 0 6px 8px;margin:0 0 10px;
  border-left:5px solid #1f3864;line-height:1.4}
.irview .unit{text-align:right;font-size:11px;margin:0 0 6px;color:#000}
.irview table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px;font-variant-numeric:tabular-nums}
.irview th,.irview td{border:1px solid #9aa5b1;padding:5px 9px;color:#000;background:#fff;text-align:right;white-space:nowrap}
.irview thead th{background:#1f3864;color:#fff;font-weight:700;text-align:center}
.irview td.lb,.irview th.lb{text-align:left;font-weight:700}
.irview td.y26{background:#dce6f1}
.irview tr.key td{font-weight:800}
.irview tr.key td.y26{background:#c6d9f0}
.irview .neg{color:#b91c1c}
.irview .pos{color:#166534}
.irview .fn{font-size:11px;color:#333;margin:8px 0 0;line-height:1.5}

.scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:middle}
thead th{background:var(--head);font-weight:650;font-size:12px;color:var(--ink-soft);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
tr.hl-ok td{background:var(--ok-bg);color:var(--ok-ink)}
tr.hl-warn td{background:var(--warn-bg);color:var(--warn-ink)}
td.calc,th.calc{background:var(--calc-bg);border-left:2px solid var(--calc-line);font-weight:700}
tr.hl-ok td.calc,tr.hl-warn td.calc{background:var(--calc-bg);color:var(--ink)}
td.cell-hi{outline:2px solid var(--warn-line);outline-offset:-2px}
.up{color:var(--ok-line);font-weight:700}
.dn{color:var(--warn-line);font-weight:700}
caption{caption-side:bottom;text-align:left;padding:8px 10px;font-size:12px;color:var(--ink-soft);font-family:var(--mono);line-height:1.5}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--warn-line);padding:15px 16px;display:flex;flex-direction:column;gap:5px}
.stat.good{border-top-color:var(--ok-line)}
.stat .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.stat .big{font-family:var(--serif);font-size:31px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--ink-soft)}

.tl{display:flex;flex-direction:column;border-left:2px solid var(--rule-strong)}
.tl-row{display:grid;grid-template-columns:80px 1fr;gap:14px;padding:8px 0 8px 16px;border-bottom:1px solid var(--rule);position:relative}
.tl-row:last-child{border-bottom:none}
.tl-row::before{content:"";position:absolute;left:-5px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--rule-strong)}
.tl-row.pivot::before{background:var(--warn-line);width:10px;height:10px;left:-6px}
.tl-row.pivot .what{font-weight:650;color:var(--warn-ink);background:var(--warn-bg);padding:1px 6px;border-radius:3px;display:inline-block}
.tl .date{font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding-top:2px}
.tl .what{font-size:14px}
.tl .src{font-size:12px;color:var(--ink-soft);display:block;font-weight:400;background:none;color:var(--ink-soft)}

.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);background:var(--surface)}
.split > div{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.split > div:first-child{border-right:1px solid var(--rule)}
.split h3{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.split ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
@media(max-width:640px){.split{grid-template-columns:1fr}.split > div:first-child{border-right:none;border-bottom:1px solid var(--rule)}}

.gaps{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--warn-line);padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.gaps h3{font-size:15px;font-weight:650}
.gaps ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.gaps p{margin:0}
footer{border-top:1px solid var(--rule-strong);padding-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
a{color:inherit;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--warn-line);outline-offset:2px}

/* 화두형 머리 (재배열 추가분) */
.top2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);border-bottom:1px solid var(--rule-strong)}
.top2 .tq{padding:6px 26px 24px 0;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:13px}
.top2 .ta{padding:6px 0 24px 26px;display:flex;flex-direction:column;gap:10px}
@media(max-width:680px){.top2{grid-template-columns:1fr}.top2 .tq{padding-right:0;border-right:none;border-bottom:1px solid var(--rule);padding-bottom:20px}.top2 .ta{padding:18px 0 22px}}
.slug2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-soft)}
.answer2{font-family:var(--sans);font-size:clamp(16px,2.2vw,19px);font-weight:700;color:var(--warn-ink);margin:0}
.gist2{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.gist2 li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--ink-soft);max-width:60ch}
.gist2 li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:1.5px;background:var(--rule-strong)}
.gist2 b{color:var(--ink);font-weight:650}
.ta ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ta li{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px;line-height:1.45}
.ta li:last-child{border-bottom:none}
.ta .d{font-family:var(--mono);font-size:10.5px;color:var(--warn-ink);padding-top:2px}
.ta .d.far{color:var(--ink-soft)}
.ta .w{color:var(--ink-soft)}
.ta .w b{color:var(--ink);font-weight:650;display:block}
/* 벡터 절 */
.vgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.vec{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--rule-strong);padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.vec.v1{border-top-color:var(--warn-line)}
.vec.v2{border-top-color:var(--ok-line)}
.vec.v3{border-top-color:var(--new-line)}
.vec b{font-size:13.5px}
.vec span{font-size:12.5px;color:var(--ink-soft);line-height:1.6;font-variant-numeric:tabular-nums}
.vec .dir{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink);margin-top:2px}

/* ── 표 공통 스크롤 메커니즘 ──
   제목은 스크롤 밖(.dvx 가 표만 감쌈), 첫 열 고정, 경계선은 셀 소유(separate),
   첫 열 폭 고정 + 본문 셀 폭 상한으로 줄바꿈이 3줄을 넘지 않게 한다 */
.dartview,.irview{overflow:visible;padding-left:0;padding-right:0}
.dartview .dt,.dartview .unit{padding-left:14px;padding-right:14px}
.irview .ttl,.irview .unit,.irview .fn{margin-left:14px;margin-right:14px}
.dvx{overflow-x:auto}
.dvx table,.scroll table,.aicmp table{border-collapse:separate;border-spacing:0}
.dartview table{min-width:640px}
.dvx th,.dvx td{border:0 !important;border-right:1px solid #b0b0b0 !important;border-bottom:1px solid #b0b0b0 !important}
.irview .dvx th,.irview .dvx td{border-right:1px solid #9aa5b1 !important;border-bottom:1px solid #9aa5b1 !important}
.dvx thead tr:first-child th{border-top:1px solid #8f8f8f !important}
.dvx th:first-child,.dvx td:first-child{position:sticky;left:0;z-index:2;border-left:1px solid #8f8f8f !important;border-right:2px solid #8f8f8f !important;
  max-width:170px;min-width:104px;word-break:keep-all;white-space:normal}
.dvx thead th:first-child{z-index:3}
.dvx thead th{position:relative}
.scroll th,.scroll td{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.scroll thead tr:first-child th{border-top:1px solid var(--rule-strong)}
.scroll th:first-child,.scroll td:first-child{position:sticky;left:0;z-index:2;border-left:1px solid var(--rule-strong);border-right:2px solid var(--rule-strong);
  background:var(--surface);max-width:170px;min-width:104px;word-break:keep-all;white-space:normal}
.scroll thead th:first-child{z-index:3;background:var(--head)}
.scroll tr.hl-ok td:first-child{background:var(--ok-bg)}
.scroll tr.hl-warn td:first-child{background:var(--warn-bg)}
.scroll td{max-width:360px;white-space:normal}
.aicmp td{max-width:340px}
@media(max-width:640px){
  .dvx table{font-size:10.5px}
  .dartview table{min-width:560px}
  .dvx th,.dvx td{padding:2px 5px}
  .dvx td:first-child,.scroll td:first-child,.scroll th:first-child{max-width:136px;min-width:96px;font-size:10px}
  .scroll td{max-width:240px}
  .dartview .bg{margin-left:4px;padding:1px 5px;font-size:9px}
}
/* 07절 확장 */
.aicmp{overflow-x:auto}
.aicmp table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.aicmp th,.aicmp td{border:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:top;line-height:1.55}
.aicmp thead th{background:var(--head);font-family:var(--mono);font-size:11px;letter-spacing:.06em;font-weight:700}
.aicmp td:first-child{font-weight:650;white-space:nowrap;background:var(--head);font-size:12.5px}
.triad{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--rule);background:var(--surface)}
.triad>div{padding:14px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.triad>div:last-child{border-right:none;background:var(--calc-bg)}
@media(max-width:640px){.triad>div{border-right:none;border-bottom:1px solid var(--rule)}.triad>div:last-child{border-bottom:none}}
.triad .tt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-soft)}
.triad b{font-size:14px}
.triad p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0;max-width:none}
</style>

<div class="wrap">

  <!-- 슬롯 1 · 제호 — 고정 -->
  <header class="masthead">
    <div class="kicker"><span>오늘의 제일기획 뉴스</span><span>[[YYYY.MM.DD 요일]]</span><span>공개자료 기준</span><span>연간 주제 · [[연간 주제]]</span></div>

    <!-- 슬롯 2 · 화두 좌 / 다가올 일정 우 — 고정. 화두는 의문형, 답은 한 문장 -->
    <div class="top2">
      <div class="tq">
        <span class="slug2">오늘의 화두</span>
        <h1>[[화두 — 의문형]]</h1>
        <p class="answer2">[[답 — 한 문장]]</p>
        <ul class="gist2">
          <li>[[요지 1]]</li>
          <li>[[요지 2]]</li>
          <li>[[요지 3]]</li>
        </ul>
      </div>
      <div class="ta">
        <span class="slug2">다가올 일정</span>
        <ol>
          <li><span class="d">오늘</span><span class="w"><b>[[일정]]</b>[[비고]]</span></li>
          <li><span class="d far">[[D−n]]</span><span class="w"><b>[[일정]]</b>[[비고]]</span></li>
        </ol>
      </div>
    </div>
  </header>

  <!-- 슬롯 3 · 세 개의 숫자 — 화두를 숫자 셋으로 요약할 수 있을 때만 -->
  <!-- <section> .stats > .stat(.good) × 3 + .note </section> -->

  <!-- 슬롯 4 · SOT 원문 재현 — 매일판의 심장. dartview(공시) / irview(IR PDF) -->
  <!-- <section> h2 → .dartview(원문 표 + .bg 하이라이트 배지 + 계산열) → .srcline(SOT 링크) → .note(회사 서술 대조) </section> -->

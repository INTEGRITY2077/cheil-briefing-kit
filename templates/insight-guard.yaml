# 인사이트 판정 규칙
#
# tone-guard 는 무엇을 말하지 않을지, style-guard 는 어떻게 쓸지 정한다.
# 이 파일은 **무엇이 인사이트인가**를 정한다.
#
# 참조: OneWave-AI/claude-skills (MIT), alirezarezvani/claude-skills (MIT),
#       jeremylongshore/claude-code-plugins-plus (MIT), VoltAgent/awesome-claude-code-subagents (MIT)
#       0x-man/mindmap-skill 은 라이선스 파일이 없어 발상만 참고하고 문구는 쓰지 않았다.

version: 1

# ─────────────────────────────────────────────
# 용어 정의 — headline-guard · insight-guard 공통 문안 (두 파일 상단에 동일하게 둔다)
# ─────────────────────────────────────────────
terms:
  헤드라인(축):
    desc: 각 축 상단의 규명 서술. 그 축에서 무엇을 알아냈는지를 말한다
    governed_by: headline-guard 5절 형태 규칙 — S1(의문형 금지) 적용 대상
  화두(h1):
    desc: 문서 머리(masthead)의 h1. insight-guard 4-2절이 세우는 문서 단위 경향성(화두)의 지면 자리
    governed_by: insight-guard 4-2절. 축 헤드라인이 아니므로 S1 을 적용하지 않는다 — 의문형 허용
  조정:
    source: im-news-editor.yaml 2절 note — 이 조정의 원본
    rule: 축 헤드라인(규명 서술)은 S1 유지, 문서 화두(h1)와 매거진형 제목은 질문 허용

# ─────────────────────────────────────────────
# 정의
# ─────────────────────────────────────────────
definition: |
  인사이트란 한 주제 안에서 겨루는 힘들을 사실의 교차점에서 읽어내는 것이다.

  각 주장은 방향을 가진 차원이고, 주장 사이에는 서로 다른 거리가 있다.
  예상 거리와 실제 거리가 어긋나는 지점이 입구이고,
  왜 어긋나는지를 규명한 결과가 본체이며,
  여러 교차점이 같은 방향을 가리킬 때 경향성이 된다.
  **그리고 그 경향성이 독자에게 무엇을 뜻하는지가 함의다 — 거기까지 가야 인사이트다.**

  합의점·대척점·모순점을 함께 보되 축은 미리 정하지 않는다.
  표본이 감당하지 못하는 범위로 말하면 인사이트가 아니라 오해다.

  2026-08-12 정정: 이 파일은 경향성까지만 규정하고 함의를 산출 항목에서 빠뜨렸다.
  그 결과 규정을 전부 지킨 호가 「정돈된 자료 목록」으로 나왔다(두 호 연속 반려).
  함의는 3-2절이 정하고, 10절 per_axis 와 게이트 I11 이 그것을 강제한다.

# ─────────────────────────────────────────────
# 1. 축 도출 — 선답 금지
# ─────────────────────────────────────────────
axes:
  rule: 힘겨루기 축은 사실이 쌓이면서 드러난 것만 쓴다
  forbidden:
    - SWOT, 5 Forces 같은 기성 프레임을 미리 놓고 칸을 채우는 것
    - 지난 회차의 축을 관성으로 유지하는 것
  derivation:
    - 같은 주제를 가리키는 사실을 묶는다
    - 그 묶음 안에서 서로 당기는 두 방향을 찾는다
    - 두 방향에 각각 사실이 둘 이상 붙으면 축으로 세운다
    - 한쪽에만 사실이 있으면 축이 아니라 관측이다
  min_facts_per_side: 2
  retire: 한쪽 사실이 stale 되어 남지 않으면 축을 내린다. 지우지 말고 로그로 강등한다

# ─────────────────────────────────────────────
# 2. 거리 — 입구
# ─────────────────────────────────────────────
distance:
  rule: 예상 거리와 실측 거리의 차이가 신호다. 실측값의 크기가 아니다
  procedure:
    - 두 관측을 고른다
    - 관측 전에 예상되는 관계를 먼저 적는다 (같이 움직인다 / 무관하다 / 반대로 움직인다)
    - 실제 관계를 잰다
    - 예상과 다르면 입구로 등록한다
  entry_types:
    - id: D1
      name: 가까울 줄 알았는데 멀다
      example_shape: 같은 방향일 것으로 본 두 지표가 반대로 움직임
    - id: D2
      name: 무관할 줄 알았는데 가깝다
      example_shape: 별개 소스의 두 사실이 같은 시점·같은 방향을 가리킴
    - id: D3
      name: 순서가 예상과 다르다
      example_shape: 먼저일 것으로 본 쪽이 뒤였음
  not_an_entry:
    - 수치가 크다는 것만으로는 입구가 아니다
    - 이미 알려진 인과를 재확인한 것은 입구가 아니다
  note: |
    파급 크기와 비자명성은 다른 축이다. 하나로 합치면 예상된 대형 사건이 최고점을 먹고
    예상 밖의 작은 신호가 묻힌다. 두 축을 따로 기록한다.

# ─────────────────────────────────────────────
# 3. 규명 — 본체
# ─────────────────────────────────────────────
resolution:
  rule: 입구에서 멈추면 인사이트가 아니다. 왜 어긋나는지 한 단계 더 간다
  required_output: 차이를 만든 항목의 이름과 크기
  outcomes:
    - id: R1
      name: 원인 규명
      desc: 차이를 만든 항목을 특정했다. 수치가 맞아떨어지면 강한 규명이다
    - id: R2
      name: 착시 해소
      desc: 지표 정의가 달라 비교 자체가 성립하지 않았다. 이것도 결과다
    - id: R3
      name: 미해소
      desc: 규명하지 못했다. 버리지 않고 보류 슬롯에 넣는다
  unresolved_slot:
    rule: 어느 쪽이 맞는지 아직 모르는 상태를 담는 자리를 둔다
    shape: 두 관측을 서로 가리키는 대칭 링크. 승자를 정하지 않는다
    why: |
      supersede 사슬은 나중 것이 이긴다는 방향을 전제한다.
      판정 전 모순은 그 사슬에 들어갈 수 없어 그냥 사라진다.
      보류 슬롯이 없으면 규명 못 한 모순이 기록에서 증발한다.
    exit: 새 사실로 판정이 서면 supersede 사슬로 옮긴다

# ─────────────────────────────────────────────
# 3-2. 함의 — 규명 다음, 지면의 목적지
# ─────────────────────────────────────────────
# 2026-08-12 신설. 규명(3절)은 "왜 어긋나는가"까지다. 그 다음 한 칸이 없으면
# 지면은 검증된 사실의 목록이 된다 — 실제로 그렇게 나왔다.
implication:
  rule: 규명한 것이 **독자에게** 무엇을 뜻하는지 한 문장으로 적는다. 적지 못하면 그 축은 지면에 올리지 않는다
  audience_source: profiles/<profile>.yaml 의 audience 블록 — 「누구에게의 함의인가」는 거기서 읽는다
  why: |
    함의 없는 인사이트는 없다. 경향성은 재료이고 함의가 산출물이다.
    누구에게의 함의인지가 정해지지 않으면 함의를 쓸 좌표가 없으므로,
    audience 블록이 비어 있는 프로파일은 이 절을 수행할 수 없다 — 그 사실을 보고에 남긴다.
  form:
    rule: 함의의 어미는 6절 주장 강도 사다리를 따른다. 근거가 얇으면 버리지 말고 어미를 낮춘다
    example_strong: { 근거: 1차자료 2건 같은 방향, 문장: "~다" }
    example_weak:   { 근거: 간접 근거만,           문장: "~로 볼 여지가 있다" }
    forbidden:
      - 빈 함의 — "시사하는 바가 크다" "주목할 만하다" (style-guard D-2 와 동일 판정)
      - 근거보다 센 어미 — 6절 사다리를 건너뛴 단정
      - 독자와 무관한 함의 — audience 밖 대상에게의 뜻(예: 투자자용 함의)을 본문 함의로 쓰는 것
  not_a_forecast: |
    함의는 전망이 아니다. "무엇이 될 것인가"가 아니라 "지금 무엇을 뜻하는가"다.
    전망은 여전히 쓰지 않는다 — 클로징의 「앞으로 확인할 지표」가 그 자리를 대신한다.

# ─────────────────────────────────────────────
# 4. 경향성 — 승격
# ─────────────────────────────────────────────
trend:
  rule: 교차점 하나는 우연일 수 있다. 서로 다른 교차점이 같은 방향을 가리킬 때 경향이 된다
  promote_when:
    independent_intersections: 3     # 서로 다른 소스에서 나온 교차점
    same_direction: true
  independence:
    desc: 같은 소스에서 나온 교차점은 하나로 센다
    check: 세 교차점의 SOT 가 서로 다른가
  demote_when: 하나라도 supersede 되면 경향성을 내리고 개별 교차점으로 되돌린다
  note: |
    시간축 반복(같은 지표를 여러 분기 관측)은 여기서 말하는 경향성이 아니다.
    그것은 추세이고, 서로 다른 축의 교차점이 겹치는 것이 경향성이다.

# ─────────────────────────────────────────────
# 4-2. 화두 — 문서 단위 경향성
# ─────────────────────────────────────────────
# 축을 사실에서 뽑으면 축들이 전부 동등하게 나온다.
# 뉴스에는 톱이 있어야 한다. 서열을 매기는 자리가 이곳이다.
# 4절이 축 사이의 경향성을 보았다면, 여기는 축들 위의 경향성을 본다.
spine:
  # 칸 자립성 (I8b, 2026-08-14 편집장 반려 — 「부호가 반대다/값은 …에 붙는다/F-055 — …」):
  # 세 칸은 각 칸 단독으로, 배경지식 없이 완결이어야 한다. 지시어(부호·값 등)의
  # 대상이 칸 밖에 있으면 실패. 근거 칸은 사람 문장이 정본이고 F-ID 는 괄호 병기 —
  # 좌표 나열은 원장의 문법이지 독자의 문법이 아니다. 정적 근사는 check_insight ⑩.
  rule: 창을 먼저 고정하고, 그 창 안에서 화두를 하나 세운다
  surface: |
    화두의 지면 자리는 문서 머리(masthead)의 h1 이다 — 상단 용어 정의의 화두(h1).
    축 헤드라인이 아니므로 headline-guard 5절 S1(의문형 금지)을 적용하지 않는다.
    의문형 허용 (im-news-editor.yaml 2절 조정)
  order: 사실 수집 → 화두 판정 → 축 도출 → 산출
  why_order: 축을 먼저 세우면 화두가 축들의 평균이 된다. 평균은 아무것도 말하지 않는다

  derivation:
    - 창 안의 사실을 주제별로 묶는다
    - 묶음마다 건수와 최고 등급을 함께 적는다
    - 「audience 의 결정에 닿는가」로 먼저 거른다 — 닿지 않는 묶음은 등급이 높아도 화두가 되지 않는다
    - 남은 것 안에서 건수가 아니라 등급으로 정렬한다
    - 1위 주제를 화두로 세우고 스탠드퍼스트에 올린다
    - 나머지 축은 화두 아래로 서열이 붙는다
  audience_filter:
    rule: 등급은 「자료가 얼마나 믿을 만한가」이지 「독자에게 얼마나 중요한가」가 아니다. 두 축을 섞지 않는다
    why: |
      2026-08-12 실측. 이 절이 등급 정렬만 규정하고 있어, 실행자가 등급 1위를 그대로 화두로 올렸다.
      그날 등급 1위는 「회사 실적자료 p.8 에 AI 솔루션 6종이 열거돼 있다」였고, 그것은 자료의 속성이지
      회사가 내린 결정이 아니다. 같은 재료를 audience 로 걸렀다면 화두는
      「회사가 AI 판로를 계열 밖에서 찾겠다고 했다」가 됐어야 한다 — 같은 자료, 다른 화두.
    # 2026-08-13 동기화 — audience 주어 정정(profiles/cheil.yaml: 의사결정을 이루는 팀, 권한자 아님)에 따라
    # 판정 문장의 동사를 팀 동사(확인·대조·초안·답 준비)로 바꿨다. 「판단해야 하나」는 권한자의 동사다.
    check: 화두를 한 문장으로 읽었을 때 audience(의사결정을 이루는 팀)가 「그래서 우리 팀이 무엇을 확인하고, 어떤 답을 준비해야 하나」로 이어갈 수 있는가

  statement:
    rule: 화두는 한 문장이 아니라 세 칸이다. 한 칸에 몰아 쓰면 접속사로 이어 붙는다
    fields:
      - id: 결론
        desc: 이 창에서 무슨 일이 있었나. 한 절로 끝낸다
        max_chars: 16
        forbidden: 접속사로 두 절을 잇는 것. 「~고 ~다」 「~인데 ~다」
      - id: 발견
        desc: 결론을 세우다 알게 된 것 중 예상과 어긋난 하나
        max_chars: 20
        note: 없으면 비운다. 채우려고 자명한 것을 쓰지 않는다
      - id: 근거
        desc: fact ID 와 한 줄 설명
        form: 목록
    why: |
      결론과 근거를 한 문장에 넣으면 결론이 근거의 무게에 눌려 길어진다.
      길어진 문장은 균형이 잡혀서 아무것도 튀지 않는다. headline-guard v1 이 같은 자리에서 실패했다
    example_bad: 재편은 실적에 찍혔고 AI는 아직 담론에만 있다
    example_good:
      결론: 재편이 상반기를 움직였다
      발견: AI 는 1차자료에 한 건도 없다
  grade_over_count:
    rule: 건수가 많아도 등급이 낮으면 화두가 되지 못한다
    why: |
      담론은 언제나 1차자료보다 건수가 많다. 말이 숫자보다 많이 나오기 때문이다.
      건수로 정렬하면 화두가 항상 담론 쪽으로 끌려간다.
    but: |
      등급 낮은 쪽의 건수가 압도적인데 등급 높은 쪽에 흔적이 없다면,
      그 비대칭 자체가 화두다. 둘 중 하나를 고르는 문제가 아니다.

  window:
    rule: 창마다 화두가 다르다. 창을 밝히지 않은 화두는 화두가 아니다
    each_derived_independently: true
    why: |
      작은 창의 사실을 메인 화두에 맞춰 고르면 선답이 된다.
      먼저 그 창만 보고 화두를 뽑고, 관계는 그다음에 잰다. 순서를 바꾸지 않는다

  relation:
    rule: 작은 창의 화두와 메인 화두의 관계를 잰다. 관계를 만들지 않고 잰다
    tags:
      - id: 보강
        desc: 같은 방향으로 증거를 더한다
      - id: 반증
        desc: 메인 화두를 흔든다
        priority: 최우선. 반증은 언제나 보강보다 값어치가 크다
      - id: 전환
        desc: 화두가 바뀔 조짐. 같은 축 위에 있으나 방향이 넘어간다
      - id: 무관
        desc: 어느 축에도 안 걸린다
        never: 억지로 붙이지 않는다. 지우지도 않는다
    unrelated_accrual:
      rule: 무관이 쌓이면 메인 화두를 재판정한다
      why: |
        이것이 척추가 강제 없이 갱신되는 유일한 경로다.
        관계를 강제하면 화두가 반증되지 않는다. 반증되지 않는 화두는 선답이다
      threshold: 무관 3건이 같은 주제로 모이면 화두 후보로 승격 검토

  decay:
    rule: 화두도 늙는다. 창이 닫히면 다시 뽑는다
    carry_over: 이전 창의 화두를 관성으로 유지하지 않는다. 1절 forbidden 과 같은 조항

  gates_ref: [I8, I9, I10]

# ─────────────────────────────────────────────
# 5. 세 종류를 함께 본다
# ─────────────────────────────────────────────
readings:
  rule: 세 종류를 모두 훑는다. 모순만 보면 축이 한쪽으로 기운다
  kinds:
    - id: 합의점
      desc: 독립된 출처가 같은 것을 가리킨다
      value: 우연일 확률이 떨어진다. 모순만큼 값어치가 있다
    - id: 대척점
      desc: 두 지표가 반대 방향으로 움직인다
      value: 축이 실재한다는 증거
    - id: 모순점
      desc: 같은 대상에 대해 서로 다른 서술이 있다
      value: 규명 대상. 판정까지 가야 결과가 된다

# ─────────────────────────────────────────────
# 6. 표본 — 주장 강도 사다리
# ─────────────────────────────────────────────
sample:
  rule: 표본이 얇으면 버리지 않는다. 주장 형식을 낮춘다
  ladder:
    - level: 단정
      requires: 1차자료 2건 이상이 같은 방향, 또는 계산이 맞아떨어짐
      form: "~다"
    - level: 관찰
      requires: 확인된 사실 1건
      form: "~로 나타난다"
    - level: 시사
      requires: 간접 근거만 있음
      form: "~로 볼 여지가 있다"
    - level: 보류
      requires: 근거가 표본 범위를 넘음
      form: 본문에 쓰지 않는다. 보류 슬롯에 남긴다
  scope_lock:
    rule: 표본의 이름과 결론의 이름이 같아야 한다
    example_violation: 인스타그램 게시물 24건으로 '대외 노출 전체'를 말하는 것
  render_n: 표본 크기를 산출물 표면에 함께 적는다. 각주로 밀지 않는다

# ─────────────────────────────────────────────
# 7. confidence — 등급과 직교하는 축
# ─────────────────────────────────────────────
confidence:
  rule: 출처 등급(어디서 왔나)과 확정도(얼마나 단정적인가)는 다른 축이다
  values:
    - confirmed    # 원문이 직접 말한 것
    - inferred     # 원문에서 도출한 것
    - speculative  # 해석
  combination_alerts:
    - pattern: 1차자료 + speculative
      why: 출처는 강한데 내용은 추측이다. 지금 스키마에는 이걸 표시할 자리가 없다
    - pattern: 보도 + confirmed
      why: 확정적으로 서술됐으나 1차자료로 확인되지 않았다

# ─────────────────────────────────────────────
# 8. 통과 못한 것의 처리
# ─────────────────────────────────────────────
disposition:
  rule: 판정에서 떨어진 관측을 지우지 않는다
  states:
    - id: active
      desc: 본문에 쓴다
    - id: logged
      desc: 판단을 바꾸지 못했다. 기록만 남긴다. 같은 관측이 다시 오면 반복 억제의 입력이 된다
    - id: held
      desc: 규명 못 한 모순. 보류 슬롯
  never: 조용히 삭제. 흔적 없이 사라지면 왜 안 썼는지 나중에 알 수 없다

# ─────────────────────────────────────────────
# 9. 시효
# ─────────────────────────────────────────────
decay:
  rule: 새 사실이 오지 않아도 판정은 늙는다
  action: 신뢰도를 낮춘다. 아카이브하거나 삭제하지 않는다
  why: 계보가 사라지면 무엇이 무엇을 대체했는지 복원할 수 없다
  trigger: stale_after 를 지나면 해당 관측이 붙은 축에 재확인 표시를 단다

# ─────────────────────────────────────────────
# 10. 산출 형식
# ─────────────────────────────────────────────
output:
  organize_by: 힘겨루기 축
  not_by: 자료 종류, 소스별, 시간순
  why: 소스별로 묶으면 교차점이 섹션 경계에서 잘린다
  per_axis:
    - 축 이름과 겨루는 두 방향
    - 합의점 / 대척점 / 모순점
    - 규명 결과 (R1 원인 / R2 착시 / R3 미해소)
    - 함의 — 이것이 독자에게 무엇을 뜻하는가 (3-2절. 없으면 그 축은 올리지 않는다)
    - 표본과 주장 강도
  forbidden:
    - 인사이트 개수를 성과로 세는 것
    - 커버리지를 품질로 정의하는 것
    - 자명한 관계를 채워 분량을 늘리는 것

# ─────────────────────────────────────────────
# 11. 게이트
# ─────────────────────────────────────────────
gates:
  - id: I1
    check: 축이 데이터에서 나왔는가. 기성 프레임을 가져오지 않았는가
  - id: I2
    check: 각 축의 양쪽에 사실이 둘 이상 있는가
  - id: I3
    check: 입구가 예상 거리와 실측 거리의 차이인가. 단지 수치가 큰 것은 아닌가
  - id: I4
    check: 규명까지 갔는가. 입구에서 멈춘 항목이 본문에 있는가
  - id: I5
    check: 경향성이라 부른 것이 서로 다른 소스의 교차점 3개 이상인가
  - id: I6
    check: 주장 강도가 표본에 맞는가. 표본의 이름과 결론의 이름이 같은가
  - id: I7
    check: 통과 못한 관측이 logged 나 held 로 남았는가. 조용히 사라지지 않았는가
  - id: I8
    check: 화두가 창과 함께 명시됐는가. audience 필터를 먼저 걸고 그다음 등급으로 정렬했는가
    note: |
      2026-08-12 정정. 종전 문면은 "등급으로 정렬했는가 건수로 정렬했는가"였고,
      두 선택지가 전부 수집 메타데이터라 **독자 중요도로 뽑은 화두는 이 게이트를 통과할 수 없었다.**
      게이트가 오답이 아니라 정답을 걸러내는 상태였다 — headline-guard 6절 warning
      ("가장 좋은 안이 게이트에 걸려 죽었다면 규칙이 잘못 조준된 것이다")이 예견한 자리다.
  - id: I9
    check: 작은 창의 화두를 메인 화두와 무관하게 먼저 뽑았는가. 순서가 뒤집히지 않았는가
  - id: I10
    check: 무관 항목이 억지로 붙거나 사라지지 않고 무관 슬롯에 남았는가
  - id: I11
    check: 축마다 함의가 있는가. 그 함의가 profiles 의 audience 를 대상으로 한 것인가 (3-2절)
    note: 2026-08-12 신설. I4(규명까지 갔는가) 다음 한 칸 — 규명에서 멈춘 지면이 두 호 연속 나왔다
  - id: I12
    check: 화두·헤드라인이 수집·계량 과정이 아니라 대상 회사에 일어난 일인가
    note: |
      2026-08-12 신설. 반려된 두 호의 헤드가 「제일기획이 조용한 날」(수집 결과의 부재)과
      「AI가 실적자료에 처음 올랐다」(PDF 단어 세기 결과)였다. 둘 다 실행자가 한 일이지
      회사에 일어난 일이 아니다. 자료의 속성(등장 횟수·게시 여부·목록 건수)은 근거이지 화두가 아니다

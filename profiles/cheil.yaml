    method: 목록에서 신규분. 전략 용어 변화를 키워드로 스캔한다
    last_checked: 2026-08-14
    last_item: "2026-08-14 덴츠 2Q FY2026 + 중기경영계획 업데이트 (F-059). WPP·옴니콤·퍼블리시스 신규 0건"

  # 세계 층 상시 수집원 (2026-08-14 편입, 이슈 #28) — F-050~055 세계 스윕의 출처

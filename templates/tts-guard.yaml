# TTS 대본 판정 규칙
#
# im-news-editor 가 눈으로 읽는 글을 다듬는다면, 이 파일은 **소리로 읽히는 글**을 다듬는다.
# 라디오 대본은 지면 표기 규칙과 충돌한다 — 지면에서 옳은 「유럽·중국」이 TTS 에서는 씹힌다.
# 대본은 화면용이 아니라 발화용 표기로 쓴다. 화면에 보여줄 때도 발화 표기 그대로 보여준다
# ("음성과 한 글자까지 같다"는 약속이 표기 변환으로 깨지면 안 된다).
#
# 2026-08-11 실측에서 출발: "유럽·중국과," 가 TTS 에서 씹혔다.

version: 1

# ─────────────────────────────────────────────
# 1. 기호 → 발화 변환
# ─────────────────────────────────────────────
symbols:
  rule: 대사 줄(A:/B:)에는 소리 나지 않는 기호를 남기지 않는다
  table:
    - { from: "·",  to: "와/과 또는 쉼표", why: 가운뎃점은 묵음이라 앞뒤 단어가 붙어 씹힌다, example: "유럽·중국 → 유럽과 중국" }
    - { from: "—/–", to: "쉼표 또는 문장 분리", why: 대시는 호흡으로 읽히지 않는다 }
    - { from: "△",  to: "마이너스 또는 ~감소", why: 재무 부호를 TTS 가 모른다, example: "△14.2% → 14.2% 감소" }
    - { from: "~",  to: "에서 …까지", example: "25,000~27,000원 → 25,000원에서 27,000원" }
    - { from: "()", to: 풀어쓰기 또는 삭제, why: 괄호 안을 본문처럼 읽어버린다 }
    - { from: "%p", to: "퍼센트포인트" }
    - { from: "숫자.숫자 (날짜)", to: "n월 n일", example: "08.10 → 8월 10일" }
    - { from: "영문 약어", to: 한글 음차 고정, example: "agentic → 에이전틱, IR → 아이알, DART → 다트" }
  keep: [ "%", "억", "원" ]   # TTS 가 잘 읽는 것은 그대로 둔다

# ─────────────────────────────────────────────
# 1b. 문형 — 소리로 성립하지 않는 구문
# ─────────────────────────────────────────────
syntax:
  rule: 직접 인용문을 문장 성분으로 끼워넣지 않는다. 인용은 간접 인용으로 푼다
  why: >
    "…않습니다, 입니다" 처럼 인용문의 종결어미와 지문의 종결어미가 연달아 붙으면
    TTS 가 한 호흡으로 읽어 한 음절처럼 뭉개진다 (2026-08-12 실측).
    지면에서는 따옴표가 경계를 만들지만 소리에는 따옴표가 없다.
  table:
    - { from: "원문 그대로 읽으면, ~습니다, 입니다", to: "간접 인용 — ~다고 적었습니다/밝혔습니다" }
    - { from: "인용문 + 이다/입니다 서술", to: "인용 내용을 풀어 한 문장으로" }
  gate: 대사 줄에서 종결어미 뒤에 조사·서술어가 붙는 자리(습니다,+입니다 / 는다,+라는)가 없는가

# ─────────────────────────────────────────────
# 2. 고유명사 발음
# ─────────────────────────────────────────────
pronunciation:
  rule: 오독 전례가 있는 고유명사는 스타일 지시에 발음을 명시한다
  known:
    - { word: 제일기획, risk: 제일기업, note: 노트북LM 실측 오독. 낭독형에서도 지시 유지 }

# ─────────────────────────────────────────────
# 3. 속도
# ─────────────────────────────────────────────
pace:
  rule: 표준 낭독은 뉴스로는 느리다. 단, 배속은 엔진 방식에 따라 거는 곳이 다르다
  edge: 'rate: "+50%" — 후처리형이라 음절 안 씹힘'
  gemini: 스타일 지시에 속도를 명시 — "표준보다 1.5배 빠른 아침 경제 라디오 속도"
  supertonic: >
    합성 speed 금지(1.05 고정) — 길이예측 압축형이라 1.5에서 합성수사
    "백사십사만"이 "십사만"으로 씹혔다 (2026-08-12 실측). 핵심 숫자 앞에는
    쉼표 호흡을 넣고, 배속은 전적으로 플레이어에 맡긴다
  fallback: 플레이어에 배속 버튼(−/+)을 두어 어느 엔진이든 독자가 조절할 수 있게 한다

# ─────────────────────────────────────────────
# 4. 게이트
# ─────────────────────────────────────────────
gates:
  - id: T1
    check: "대사 줄에 · — △ ~ 괄호가 남아 있지 않은가 (grep 으로 검사 가능)"
  - id: T2
    check: 영문 약어가 음차 없이 남아 있지 않은가
  - id: T3
    check: 화면에 보여주는 대본과 합성에 넣은 대본이 같은 파일인가
  - id: T4
    check: 속도 지시가 들어갔는가 (엔진별 방식으로)
  - id: T5
    check: 직접 인용 끼워넣기 문형이 없는가 — 종결어미가 연달아 붙는 자리("~습니다, 입니다") 0건

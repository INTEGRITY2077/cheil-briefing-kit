# 브리핑 킷 설정 — 기계마다 다른 값만 여기 둔다
#
# 사용법: 이 파일을 config.yaml 로 복사한 뒤 채운다.
#         config.yaml 은 배포본에 포함하지 않는다 (.gitignore)
#
# 번들 안에는 절대경로도 계정명도 넣지 않는다. 전부 이 파일에서 읽는다.

version: 1

# ─────────────────────────────────────────────
# 검토자
# ─────────────────────────────────────────────
# OKF 의 verified 필드에 들어가는 식별자다.
# 기본값: 비움(검토자 없음) — 설치 절차(SETUP 3-1)는 이 값을 묻지 않고 비운 채 두며,
# 그 사실은 사전 합의 카드의 고지 항목으로 사용자에게 알린다. 비어 있으면
# verified 도 비어 나간다(사람 검토 전 상태 그대로).
# 값을 넣을 때: 로컬 계정명을 쓰지 않는다. 사내에서 통용되는 이름이나 사번 별칭을 쓴다.
reviewer:                       # 기본 비움 — 예: human:hong.gd

# ─────────────────────────────────────────────
# 경로 — 킷 루트 기준 상대경로
# ─────────────────────────────────────────────
paths:
  bundle: ./okf                 # OKF 지식 번들
  profiles: ./profiles
  templates: ./templates
  output: ./output              # 생성물. 배포본에 포함하지 않는다
  archive: ./okf/archive
  ledger: ./output/ledger/broadcast_log.jsonl   # 방송 원장. 없으면 루틴이 새로 만든다

# 추적 대상. profiles/ 아래 파일명에서 .yaml 을 뺀 값
profile: cheil

# ─────────────────────────────────────────────
# 실행 모드 — 업무 성격에 따라 직렬과 다이나믹 워크플로우를 섞는다
# ─────────────────────────────────────────────
# 원칙: 독립 작업의 팬아웃(여러 채널·여러 후보·여러 파일을 서로 몰라도 되는 검사)은
# workflow, 순서 의존·단일 맥락(대본 집필, 발행→공유→핀)은 serial 이 맞다.
# workflow 로 지정된 단계라도 Workflow 도구가 세션에 없으면 순차로 강등되고
# 보고에 "수집 경로: 순차" 가 남는다 — 값을 serial 로 바꾸면 강제 직렬.
execution:
  workflow_available: null   # 설치 시 헬스체크가 기록 (true/false) — SETUP 0-2
  stages:
    collect_sweep: workflow  # 1절 소스 수집 — 채널 7종 병렬 스윕
    fact_verify:   workflow  # 1절 검증 — 채택 후보별 팩트체커 병렬
    compose:       serial    # 4절 대본·웹판 집필 — 단일 편집 맥락, 병렬 이득 없음
    gates:         serial    # 5절 check_*.py — 수 초짜리 순차, 병렬 불요
    publish:       serial    # 4b 발행→공유→핀 — 순서 의존, 병렬 금지
    deep_audit:    workflow  # 주간 점검·전수 감사류 — 다축 병렬 (해당 작업이 있을 때만)

# ─────────────────────────────────────────────
# 음성 생성
# ─────────────────────────────────────────────
tts:
  # supertonic | gemini | edge | sapi | custom | none
  #
  #   supertonic : 기본값(2026-08-12 확정). 로컬 ONNX — 키·네트워크 불필요,
  #                Windows 네이티브 동작. tools/make_audio_supertonic.py 가 실행한다.
  #                pip install supertonic soundfile. 최초 1회 모델(~99MB) 자동 다운로드.
  #                합성 배속 금지(1.05 고정, 씹힘 방지) — 청취 배속은 플레이어 1.3×.
  #                기본 보이스 voices/anchor-f1f2-30.json (실청 채택 블렌드).
  #   gemini     : 2순위. 감정·톤 지시가 필요할 때. .env 의 GEMINI_API_KEY 필요.
  #   edge       : 3순위 예비. Edge TTS (신경망, 키 불필요, 네트워크 필요).
  #                대본을 한 글자 그대로 낭독한다. tools/make_audio.py 가 실행한다.
  #                pip install edge-tts 한 번이면 된다.
  #   (notebooklm : 엔진 값으로 지원하지 않는다 — 기각 기록만 남긴다.
  #                생성형 2인 대화라 대본을 재구성한다. 2026-08-11 실측 —
  #                발음 오류("제일기업"), 애드리브 오프닝, 길이 지시 무시
  #                (2~3분 요청 → 5:21, 조인 프롬프트 후에도 14:28), 대본에 없는
  #                프레임 생성("현금 보낸"). 프롬프트로 잡히지 않는다.
  #                정확성이 필요한 정기 브리핑에 쓰지 않는다.)
  #   sapi       : Windows 내장 음성. 완전 자동이지만 품질이 낮다.
  #   custom     : 외부 명령 호출. 아래 custom 블록을 채운다.
  #   none       : 대본까지만 만들고 끝낸다.
  engine: supertonic  # 사다리: supertonic → gemini(키 있을 때) → edge

  # ── 웹판 이식 (embed_radio.py) ──────────────────────────────
  # 오디오는 data URI 로 싣는다. base64 는 원본의 4/3 로 부풀기 때문에
  # 「AAC 크기 × 1.34 + 지면」 이 곧 호 크기다.
  #
  # 2026-08-12 실측: 3분 20초 대본을 96k 로 실으면 AAC 2.45MB → base64 3,338KB →
  # 호 3.28MB. 64k 모노로 내리면 AAC 1.59MB → 호 2.14MB.
  #
  # 주의: **크기를 내려도 아티팩트 공개 공유는 풀리지 않았다** (3.28MB·2.14MB 둘 다 거절).
  # 거절의 실체는 PATCH /api/frame/perm → 409 {"reason":"unscannable"} 이고, 화면 문구
  # ("This version can't be shared publicly…")는 원인과 무관하다. publish-checklist E5 참조.
  # 아래 max_html_mb 는 검증된 임계가 아니라 **편집 규율**이다 — 통과해도 공유가 보장되지 않는다.
  embed:
    bitrate: 64k        # AAC 비트레이트. 낭독은 64k 모노로 충분하다
    channels: 1         # 1인 낭독이 표준이라 모노
    max_html_mb: 3.0    # 웹판 상한. tools/check_size.py 가 판정한다 (D8)

  supertonic:
    # supertonic 은 1인 낭독이 표준이다 (script-radio 화자 구성 절).
    # 2인 판형은 gemini 엔진 전용 — 여기의 voice_reporter 는 예외 상황
    # (2인 대본이 실수로 들어온 날) 을 깨지지 않게 받아주는 안전판일 뿐이다.
    voice: ./voices/anchor-f1f2-30.json # [A] 1인 낭독 보이스. 내장 이름(F1 등)도 가능
    voice_reporter: M2                  # 안전판 — 표준 아님
    tool: ./tools/make_audio_supertonic.py

  edge:
    voice_anchor: ko-KR-SunHiNeural     # [A] 앵커
    voice_reporter: ko-KR-InJoonNeural  # [B] 기자
    rate: "+8%"                         # 뉴스 낭독 속도
    tool: ./tools/make_audio.py

  # 본인용 최상 음질. 키가 필요해 배포 킷 기본이 아니다.
  # .env 에 GEMINI_API_KEY 를 넣으면 켜진다 (.env 는 gitignore, 배포에 미포함).
  # 무료층: aistudio.google.com/apikey · 멀티스피커 + 스타일 지시 · 대본 그대로 낭독
  gemini:
    voice_anchor: Kore      # [A] 앵커
    voice_reporter: Charon  # [B] 기자
    tool: ./tools/make_audio_gemini.py
    on_missing_key: edge    # 키가 없으면 edge 로 자동 강등

  # 나중에 바꾸려면 engine 을 sapi 로 두고 아래를 쓴다
  sapi:
    voice: auto                 # 설치된 ko-KR 음성을 탐지한다. 이름을 박지 않는다
    rate_anchor: -10            # [A] 앵커 속도 (%)
    rate_reporter: 8            # [B] 기자 속도 (%)
    pitch_reporter: 8           # [B] 피치 (%)
    on_missing_voice: script-only    # ko-KR 음성이 없으면 대본까지만

  # 외부 TTS 를 붙일 자리. {script} 와 {audio} 가 치환된다
  custom:
    command: ""
    # 예시
    #   command: "python tools/tts.py --in {script} --out {audio} --voice ko-female"
    output_format: m4a
    timeout_sec: 900

# ─────────────────────────────────────────────
# 스케줄 — 자유롭게 바꾼다
# ─────────────────────────────────────────────
# 표준 5필드 cron 이고 로컬 시간 기준이다. 분 시 일 월 요일.
#
#   "0 8 * * *"     매일 오전 8시          (기본값)
#   "0 7 * * 1-5"   평일만 오전 7시
#   "30 6 * * *"    매일 오전 6시 30분
#   "0 8,18 * * *"  하루 두 번, 8시와 18시
#
# 앱이 켜져 있을 때만 실행된다. 꺼져 있으면 다음 실행 때 밀린 것이 함께 돈다.
# 출근 전에 들으려면 기상 시각보다 조금 앞에 둔다. 생성에 3~5분 걸린다.
schedule:
  # 아래 시각은 설치 때 사용자와 합의한 값이다 (SETUP 0-5). 디폴트: 생성 07:00 /
  # 배포 07:45. 바꾸고 싶으면 언제든 워커에게 말해 이 블록을 고치면 된다 —
  # 루틴·문서의 시각 표기는 전부 이 값을 따르는 디폴트 예시일 뿐이다.
  daily:     "0 7 * * *"        # 생성 시작 크론 (합의값)
  publish_at: "07:45"           # 배포 시각 (합의값) — 이 시각 이후에만 공유 버전 재지정
  weekly:    "10 7 * * 1"       # 월요일 오전 7시 10분. 일일 실행과 겹치지 않게 뒤에 둔다
  monthly:   "20 7 1 * *"       # 매월 1일 오전 7시 20분
  quarterly: trigger            # 시각 없음. DART 결산실적공시예고를 감지하면 돈다

  # 스케줄을 바꾼 뒤에는 등록된 태스크도 갱신해야 반영된다.
  # Claude 에게 "브리핑 스케줄을 config 대로 갱신해줘" 라고 하면 된다.

# ─────────────────────────────────────────────
# 보존 정책
# ─────────────────────────────────────────────
retention:
  audio_days: 30                # 대본이 있으면 재생성 가능하다
  daily_log_days: 90            # 이후 월 단위로 병합
  script: keep                  # 가볍다
  facts: keep                   # supersede 이력이 자산이다
  artifact: keep                # 호마다 새 아티팩트 — 날짜별 영구 보존, 덮어쓰기 금지 (routine 4b, 2026-08-12 확정)

maintenance:
  active_concept_target: 50     # 이 수를 넘으면 분기 압축 대상
  link_check: monthly
  health_report: monthly

# ─────────────────────────────────────────────
# 가드
# ─────────────────────────────────────────────
guards:
  tone: ./templates/tone-guard.yaml
  style: ./templates/style-guard.yaml
  style_genre_map:
    artifact: report
    script: broadcast
    ledger: ledger

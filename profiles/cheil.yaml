# 판정 규칙은 insight-guard.yaml 4-2절. 여기는 이 대상의 창과 현재 값만 둔다.
spine:
  windows:
    - id: day
      close: 매일 08:00
      derive_from: 그날 신규 사실
    - id: month
      close: 말일
      derive_from: 그달 신규 + 그달 supersede
    - id: quarter
      close: 실적발표일
      derive_from: 분기보고서 + 실적발표자료 기준. 1차자료가 없으면 분기 화두를 세우지 않는다
    - id: half
      close: 반기보고서
      derive_from: 반기 전체
      is_main: true         # 다른 창의 관계를 재는 기준
    - id: year
      close: 사업보고서(연간)
      derive_from: 연간 전체
      # 연간 주제 — templates/article-skeleton.html:235 kicker 의 [[연간 주제]] 플레이스홀더가
      # 참조하는 정본(유일한 출처)이다. 이 필드가 비어 있으면 그 칸을 비워 두고,
      # ranking 상위 축 등 다른 값으로 임의 채움을 금지한다 (issue #15 수리).
      annual_theme: AI와 광고업
  main_window: half

  current:
    window: half
    period: 2026 상반기
    derived: 2026-08-11
    결론: 재편이 상반기를 움직였다
    발견: AI 는 1차자료에 한 건도 없다
    근거:
      - { fact: F-003, why: 회사가 밝힌 원인 둘 다 재편 관련 }
      - { fact: F-006, why: 거래가 준 지역이 회사가 밝힌 재편 지역과 겹침 }
      - { fact: F-007, why: 지역 법인 실적도 같은 방향 }
    ranking:
      - { theme: 해외 사업 재편, rank: 1, top_grade: 1차자료, facts: [F-003, F-006, F-007] }
      - { theme: AI,           rank: 2, top_grade: 증권사,   facts: [F-008, F-009, F-010, F-012, F-013] }
      - { theme: 영업이익 감소, rank: 근거, top_grade: 1차자료, facts: [F-001, F-002],
          note: 재편의 표면이다. 톱이 아니라 톱의 근거로 쓴다 }
    # 재서술 트리거. 문법 정본은 아래 macro_axes 머리 주석의 「트리거 문법」이다
    # (2026-08-15 이슈 #35 통일 — 종전에는 자유서술 한 줄 「무관 누적 3건 또는 반기 마감」
    # 이었고 이를 읽는 코드도 문법도 없었다. 같은 뜻을 같은 문법으로 옮긴 것이며,
    # 여기 조건은 여전히 사람이 읽고 판정한다 — 기계가 읽는 것은 macro_axes 쪽뿐이다).
    restated_when:
      - 무관 >= 3        # 무관 판정 누적 3건
      - 창마감 half      # 반기 마감

  log: output/ledger/spine.jsonl

# ─────────────────────────────────────────────
# 큰축 (macro axes)
# ─────────────────────────────────────────────
# 2026-08-13 신설. 큰축은 호를 넘어 사는 추적 질문이다.
# 작은축(그날의 절)은 소속 큰축을 선언한다(스켈레톤 section.sec 의 data-macro) —
# 무소속 = 필요성 재평가 대상. 관측 태그(지지/반증/조건형성/중립)는 수집 등재 시
# 함께 판정한다. 축의 재독·개폐 절차는 routine-SKILL 2b 절(재귀납)이 정본이다
# (2026-08-15 이슈 #35 — 종전 「소급 재조사 2026-08-13 완료, 이후 증분」 하드코딩 대체).
# 관측 계보의 원장(점수판)은 okf/axes.md — 아래 status 는 그 요약이다.
#
# 반증 전담 렌즈 (2026-08-15 이슈 #35 신설).
#
# 실측 근거 — 2026-08-15 재집계(검수 문제 19-3 수리). 종전 문안 「원장 67건의 방향
# 태그가 지지 9·조건형성 4·중립 2·반증 0」 은 **어떤 집계와도 맞지 않았다**(합이 15
# 라 67 과도, 계보 재계산과도 어긋난다). okf/axes.md 계보 표를 그대로 재계산한 값:
#   MA1 지지 5 · 반증 0 · 조건형성 7 · 중립 4  (16행)
#   MA2 지지 14 · 반증 0 · 조건형성 9 · 중립 5 (28행)
#   MA3 지지 9 · 반증 0 · 조건형성 4 · 중립 0  (13행)
#   합계 지지 28 · 반증 0 · 조건형성 20 · 중립 9 — **계보 57행**, 여기에 무소속 판정
#   원장 10행이 따로 있다. 기계로 재계산 가능한 값이므로 이 수치가 정본이다
#   (check_ledger ⑤ 가 같은 재계산으로 이 표들을 대조한다).
# 바뀌지 않는 관측은 하나다: **세 축 전부 반증 0**. 그리고 반증 재료(챗GPT CPM
# $60→$25 하락·OpenAI 자체 목표 대비 10% 페이스·빅6 미 광고비 점유율 44.6%→29.6%)가
# 이미 지면에 실려 있는데도 반증으로 계상되지 않았다 — 축이 옳아서가 아니라 아무도
# 반증을 찾지 않았기 때문이다. #28 의 「축이 수집을 끈다」 배선이 확증 쪽으로만 돌았다.
# 그래서 축마다 refute_probes 를 두고 수집 스윕에 refuter 채널을 상설한다
# (지시 정본은 여기, 채널 운용은 routine-SKILL 1절).
#
# 트리거 문법 (reinduct_when · spine.restated_when 공용, 이슈 #35):
#   「<지표> <비교> <수>」 또는 「창마감 <spine.windows[].id>」
#   지표 — 반증: 그 축 계보 표의 반증 행 수 ·
#          무소속: 무소속 판정 원장에서 **reinduct_baseline 이후에 새로 등재된** 행 수 ·
#          무관: 무관 판정 누적 건수. 비교 — >= 또는 >.
#   기계가 읽는 것은 「반증 >= N」 한 줄뿐이다 (check_ledger ⑥ⓑ — 충족했는데
#   재귀납 기록이 없거나 그 기록이 최신 반증보다 이르면 차단). 나머지 조건은 사람이
#   읽고 판정한다 (황금률: 기계는 형식·봉인만, 축의 유지/분할/합병/신설 판정은 사람·패널 몫).
#
#   「무소속」 지표에 기준선을 붙인 이유 (2026-08-15 — 검수 문제 12 수리):
#   종전 정의 「무소속 판정 원장 행 수」는 **도입 시점에 이미 10행**(F-014·015·026·
#   029·035·037·039·040·058·064)이었고, 같은 표가 「원장 삭제는 하지 않는다」를
#   명시해 감소가 구조적으로 불가능하다. 그래서 `무소속 >= 3` 은 세 축 전부에서
#   **도입 첫날부터 영구 참**이었다 — 래치된 상시 참은 사람이 곧 무시하고, 실질
#   트리거는 「반증 >= 1」 하나만 남는다. 또 무소속 원장은 축별이 아니라 **전역 단일
#   표**라 이 조건은 축을 가리지 못한다. 기준선(=직전 재귀납 시점, 없으면 도입일)
#   이후 **신규 등재분**만 세면 조건이 다시 사건을 가리킨다.
reinduct_baseline: 2026-08-15   # 무소속 지표의 기산점. 재귀납을 실제로 돌린 날로 갱신한다

# ─────────────────────────────────────────────
# refuter 채널의 「어디서·얼마나」 (2026-08-15 신설 — 검수 문제 15 수리)
# ─────────────────────────────────────────────
# 왜 필요한가: refute_probes 는 「무엇을 찾나」(명제 14개)만 정의했고, 나머지 Sweep
# 채널이 전부 갖고 있는 **소스·질의·시간창·처리량**이 refuter 에만 없었다. 그러면
# 매일 명제 14개를 얕게 훑는 형식적 1회전으로 붕괴하고, 그 붕괴는 「반증 탐색 이력」의
# 탐색 범위 칸에만 남는다(기계는 보지 않는다). 그래서 어디서·얼마나를 정본으로 못박는다.
refute_sweep:
  sources:                      # 상시 소스에서 그대로 빌린다 — 새 소스를 늘리지 않는다
    - id: global-peers          # 홀딩사 실적·전략 후퇴 발표
    - id: ai-ad-supply          # 공급측 실측 — 목표 미달·단가 하락·철수
    - id: global-demand         # 광고주 내재화/대행 복귀
    - id: broker-reports        # 목표가 하향·전환 회의론
    - id: trade-press           # 계약 이탈·인하우스 이관 보도
    - id: dart-target           # 손상차손·상각·특수관계자 거래 반전
  query_hint: |
    축의 전제를 **부정하는 어휘**로 검색한다 — 하향·철회·중단·복귀·이관·손상차손·
    미달·둔화·해지·인하우스. 지지 어휘(확대·수주·도입·성장)로는 이 채널을 돌리지 않는다.
  window_days: 7                # 시간창 — 최근 7일 신규분. 분기 실적 시즌은 30일로 넓힌다
  probes_per_run: 5             # 하루 처리량 — 명제 14개를 매일 다 훑지 않는다
  rotation: round_robin         # 우선순위 회전 — MA1→MA2→MA3 순으로 이어서 돈다.
                                # 그날 어디까지 돌았는지는 axes.md 「반증 탐색 이력」의
                                # 탐색 범위 칸에 프로브 번호로 남긴다(다음 실행의 시작점)
  # 「반증 탐색 이력」 표의 결과 칸 어휘 정본 (검수 문제 4 수리).
  # 왜: 채널 도입 당일 세 축에 들어간 첫 행이 「미탐색 — 다음 실행부터 상설」이었는데,
  # check_ledger ⑥ⓒ 는 **날짜 행의 존재만** 봤다. 즉 「아무것도 탐색하지 않았다」는
  # 자백이 「최근 발행일에 탐색 기록이 있다」 판정을 만들었다 — 규칙 도입 순간 스스로
  # 채운 기록이 그 규칙의 근거가 되는 자기 참조 순환이다. 아래 어휘로 시작하는 행은
  # 탐색 기록으로 세지 않는다(행은 남긴다 — 「안 찾은 날」의 기록도 기록이다).
  log_result_vocab:
    non_search: [미탐색, 미실행, 건너뜀]

  retro_pass:                   # 소급 재판정 (검수 문제 11 수리) — 아래 주석 참조
    status: 대기
    targets: [F-051, F-052, F-038]
    note: |
      이 메커니즘의 신설 근거로 인용된 재료는 **이미 원장에 있다** — F-051·F-052·F-038
      이 그것이고 okf/axes.md 계보에서 전부 '조건형성' 태그다. 그런데 refuter 채널은
      Sweep 채널과 같은 층(「이미 원장에 있는 사실은 제외한다」)에서 **새 외부 관측만**
      찾으므로, 진단이 가리킨 대상을 처방이 건드리지 못한다. 그래서 상설 탐색과 별도로
      **소급 재판정 1회**를 둔다: 위 targets 를 refute_probes 로 다시 읽어 방향 태그를
      유지(조건형성)할지 반증으로 옮길지 판정한다. 판정은 사람·패널 몫이고(황금률)
      절차는 routine-SKILL 2b 절 ⓪. 끝나면 status 를 완료로 바꾸고 그날 날짜를 적는다.
macro_axes:
  - id: MA1
    question: >-
      삼성전자의 마케팅 물량이 미디어와 크리에이티브로 갈라져 시장별로 재배분될 때,
      제일기획에는 어느 쪽 물량과 결정 권한이 남는가?
    status: { 지지: 5, 반증: 0, 조건형성: 7, 중립: 4, 최신관측: F-063 }
    # 증류 명제는 여기 두지 않는다 — 정본은 okf/axes.md MA1 절의 「**현재 판정(증류)**」
    # 슬롯이고 여기는 참조만이다 (이슈 #35 · 정본-판정 분리).
    distilled: okf/axes.md — "## MA1" 절의 「**현재 판정(증류)**」 줄
    reinduct_when:
      - 반증 >= 1        # 반증 첫 발생 — 축 전제가 흔들린 첫 순간이 재독 시점이다
      - 무소속 >= 3      # 무소속 누적 — 축이 그날의 관측을 받지 못하는 상태의 누적
      - 창마감 quarter   # 분기 마감 — 정기 재독
    refute_probes:
      - 삼성이 미디어와 크리에이티브를 한 대행사로 다시 통합 발주한 시장 — 기능 분리 재배분 전제의 반례
      - 제일이 크리에이티브까지 잃은 시장(로컬 대행사·광고주 인하우스 이관) — 「크리에이티브는 남는다」 전제의 반례
      - 삼성 특수관계자 거래·계열 매출 비중이 다시 늘어난 지역·기간 — 「계열 물량 축소」 전제의 반례
      - 집행 결정 권한이 제일로 넘어온 사례(제일 주도 글로벌 캠페인·미디어 수임) — 권한 이탈 전제의 반례
    checkpoints:
      - 8월 중 DART 반기보고서 등재 — 특수관계자 거래 지역별 표에서 호주·오세아니아 및 상반기 계열 비중의 추가 하락 여부
      - 2026-08-11~14 Samsung Group Asia Conference 이후 IR 자료·후속 보도 — 계열 물량·해외 재편 언급 여부
      - 2026-10-23(추정) 3분기 실적발표 컨퍼런스콜 — 폴드8 출시 분기 계열 매출 반영과 호주 이관에 대한 회사의 언어
      - 타 시장(유럽·동남아) 삼성 미디어 대행 리뷰 보도 — 호주형 분리(미디어=퍼블리시스, 크리에이티브=제일)의 반복 여부

  - id: MA2
    question: >-
      광고회사의 돈과 운영 권한이 사람 조직에서 AI 플랫폼·데이터 자산으로 옮겨가는 재편에서,
      제일기획의 이동은 어디까지 왔고 시장은 언제부터 그것을 전환 투자로 값을 쳐주는가?
    status: { 지지: 14, 반증: 0, 조건형성: 9, 중립: 5, 최신관측: F-065 }
    distilled: okf/axes.md — "## MA2" 절의 「**현재 판정(증류)**」 줄
    reinduct_when:
      - 반증 >= 1
      - 무소속 >= 3
      - 창마감 quarter
    refute_probes:
      - AI 전환에 값을 안 쳐준 사례 — 전환 발표 후 주가·목표가가 되레 내린 홀딩사·대행사
      - 전환 비용이 회수되지 않은 사례 — 플랫폼·데이터 투자 후 마진·매출이 나빠진 분기 실적
      - 사람 조직으로 되돌린 사례 — 감원 철회·재채용, 인하우스 AI 접고 대행 복귀한 광고주
      - 매입한 AI·데이터 자산의 손상차손·상각 — 자산이 값을 못 했다는 회계 흔적
      - AI 플랫폼 없이 이익을 낸 대행사 — 다각화·인력 모델로 마진을 낸 대조군(전환이 조건이 아니라는 반례)
    checkpoints:
      - 2026-08-17 LiveRamp 인수 주주 표결 — 가결 시 대행사 자본의 데이터 자산 이동이 기정사실화
      - 8월 중 반기보고서 등재(제일·이노션 동시) — 판관비·퇴직급여·무형자산(소프트웨어 개발비)·직원 현황에서 재배치의 방향 확인
      - 2026-08-21(추정) 제일 매거진 8월분 — AI·조직 담론의 지속 여부
      - 2026-10-23(추정) 3분기 컨퍼런스콜·10/26 국내 NDR — '일시적 효율화 비용'의 소멸 여부, 커넥트 AI·GEO의 수주·매출 등 상용 성과 수치 공개 여부
      - 10월 말 NDR 이후 증권사 리포트 재개 여부와 목표가 방향(23,500원 하향 이후 추종 여부)
      - WPP £500m 절감·인력 감축의 다음 분기 진행 수치
      - 11월(추정) 2027년 예산 편성 시즌 — 광고주·대행사 양쪽의 AI 배분 언급

  - id: MA3
    question: >-
      광고주 예산이 검색·소셜을 떠나 AI 대화형 지면과 자율 집행 시스템으로 흘러갈 때,
      그 돈은 대행사를 거치는가 건너뛰는가 — 대행사는 집행 결정의 어디에 남는가?
    status: { 지지: 9, 반증: 0, 조건형성: 4, 중립: 0, 최신관측: F-062 }
    distilled: okf/axes.md — "## MA3" 절의 「**현재 판정(증류)**」 줄
    reinduct_when:
      - 반증 >= 1
      - 무소속 >= 3
      - 창마감 quarter
    refute_probes:
      # 이 프로브는 **소급 재판정이 먼저다** (refute_sweep.retro_pass, 검수 문제 11):
      # 「후속을 찾으라」고만 쓰면 이 메커니즘의 신설 근거로 인용된 재료(F-051·F-052)가
      # 조건형성 태그 그대로 남고 반증 0 상태가 내일도 그대로다. 등재분의 방향 재판정이
      # 새 외부 관측 탐색보다 앞선다.
      - >-
        AI 지면 예산이 정체·축소된 실측 — CPM 하락·공급자 목표 미달·시장 전망 하향.
        등재분 재판정이 먼저다 — F-051(챗봇 내 광고비 <$1B)·F-052(OpenAI 목표 대비 −90%)가
        조건형성인가 반증인가를 판정하고, 그 다음에 후속 신규 관측을 찾는다
      - 광고주가 AI 지면 집행을 대행사로 되돌린 사례 — 내재화 철회·리뷰 재발주
      - 챗GPT·AI 지면 광고를 중단·연기한 대형 광고주 — 지면 이동 전제의 반례
      - 검색·소셜 예산이 되레 늘어난 실측 — 「예산이 기존 지면을 떠난다」 전제의 반례
      - 자율 집행 시스템이 수수료를 되레 키운 사례 — 「에이전트가 수수료 구간을 압박한다」 전제의 반례
    checkpoints:
      - 2026-08-17 AAM 기존 픽셀 자동 활성화 시행 — 광고주 데이터 연동의 기본값 전환, 옵트아웃 논란·집행 확대 여부
      - 챗GPT 광고 국내 시범의 정식 전환·확대 발표 여부(F-012 후속)와 브라질·멕시코 출시(F-042 예고)의 실행
      - 구글 3분기 실적·AI Mode 광고 지표 — 검색 예산 이탈의 공급자 쪽 확인
      - 제일기획 3분기 발표에서 GEO·AI 솔루션의 매출 기여 언급 여부
      - 2027-01(추정) 대한민국 총 광고비 결산 — AI·리테일 등 신규 채널의 예산 점유 실측

# ─────────────────────────────────────────────
# EVAL
# ─────────────────────────────────────────────
# 발행 여부가 아니라 분량을 정한다. 매일 나간다.
eval:
  scores:
    tier1_new: 5
    supersede: 4          # 정정은 그 자체가 소식이다
    tier2_new: 2
    tier3_new: 1
    days_since_deep: 1    # 마지막 심층 이후 하루당 가산
  relation_bonus:
    # 메인 화두와의 관계에 따른 가산. 사실 등급과 직교한다
    반증: 5               # 화두를 흔드는 것이 가장 값어치 있다
    전환: 3
    보강: 0               # 이미 아는 방향이다. 등급 점수만으로 충분하다
    무관: 1               # 누적이 화두 재판정의 입력이므로 0 이 아니다
  thresholds:
    deep: 8               # 심층 리포트 추가 + 아티팩트 갱신
    draft: 3              # 대본 초안만
  floor:
    always_include: [오늘 일정, 다가올 일정]
    why: 신규가 없는 날에도 최소 분량이 나온다

# ─────────────────────────────────────────────
# SUPERSEDE
# ─────────────────────────────────────────────
# 같은 사실의 갱신판이 오면 이전 것을 눕히고 이력을 남긴다.
supersede:
  grade_order: [관찰, 보도, 증권사, 1차자료]     # 오른쪽이 높다
  rules:
    - 등급이 높은 자료가 오면 낮은 자료를 대체한다
    - 추정치는 확정치로 대체한다
    - 부분 기간은 누적 기간으로 대체하지 않는다. 둘 다 남긴다
  known_chains:
    - [컨센서스 추정, 잠정실적 공정공시, 분기보고서]
    - [언론 보도, IR 실적발표자료]

# ─────────────────────────────────────────────
# 방송 대본
# ─────────────────────────────────────────────
script:
  blocks: [오늘, 새 소식, 다가올 일정, 심층]
  length_min: 2
  length_max: 8
  speakers:
    A: 앵커
    B: 기자
  reference: concept_id     # 아티팩트 섹션 번호가 아니라 개념 ID로 건다. 섹션은 재배열된다

# ─────────────────────────────────────────────
# 반복 억제
# ─────────────────────────────────────────────
# ledger/broadcast_log.jsonl 에 무엇을 언제 읽었는지 기록한다.
# 대본을 만들기 전에 이 파일을 먼저 읽는다.
broadcast:
  log: output/ledger/broadcast_log.jsonl

  facts:
    max_airings: 1
    revive_on_supersede: true
    revive_framing: 정정으로 다룬다. 같은 사실의 재방송이 아니라 갱신 소식이다

  agenda:
    max_airings: 3
    air_on:
      - new              # 새로 등재된 날
      - d-7              # 이레 전
      - d-0              # 당일
    silent_otherwise: true

  deep:
    repeat_background: false
    on_context_needed: 문서로 넘긴다. "자세한 경위는 브리핑 문서에 정리해 뒀습니다"

  # 신규가 없는 날에 반복 대신 쓸 것
  quiet_day:
    - id: no_change
      text: 변화 없음을 한 줄로 명시한다. 이것도 정보다
    - id: pull_forward
      text: D-7 보다 먼 일정 중 아직 다루지 않은 것 하나를 당겨온다
    - id: stale_preview
      text: stale_after 가 지난 개념을 갱신 예고로 쓴다
      why: 정리 대상 목록이 그대로 "곧 바뀔 것" 목록이다
  allow_short: true
  min_minutes_hard: 2
  never: [반복으로 분량 채우기, 근거 없는 전망으로 채우기]

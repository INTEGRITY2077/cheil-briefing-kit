# 톤 가드 — 사내 구성원 대상 브리핑
#
# 이 브리핑은 매일 자동 생성된다. 사람이 매번 검수할 수 없으므로
# 톤 기준을 규칙으로 고정한다. 대본 생성 단계에서 이 파일을 통과해야 발행된다.
#
# 원칙: 독자는 이 회사에서 일하는 사람이다.
#       외부 평가자가 아니라 당사자에게 필요한 정보를 준다.
#       숫자는 그대로 두고, 판정은 하지 않는다.

version: 1
audience: 사내 구성원

# ─────────────────────────────────────────────
# 1. 핵심 원칙
# ─────────────────────────────────────────────
principles:
  - id: P1
    rule: 숫자는 절대 완화하지 않는다
    why: 나쁜 수치를 감추면 브리핑 자체가 신뢰를 잃는다. 톤 조정은 서술의 문제이지 수치의 문제가 아니다.

  - id: P2
    rule: 비교는 하되 우열을 판정하지 않는다
    why: 양쪽 숫자를 나란히 놓으면 독자가 판단한다. 시스템이 대신 판정할 이유가 없다.

  - id: P3
    rule: 사내 부서·팀·도구를 평가 대상으로 삼지 않는다
    why: 그 부서 사람이 이 브리핑을 듣는다. 관찰은 하되 책임을 귀속시키지 않는다.

  - id: P4
    rule: 해석은 근거와 함께, 단정은 하지 않는다
    why: 자동 생성물의 해석은 검증되지 않았다. 어미로 그 사실을 드러낸다.

  - id: P5
    rule: 종합 판단은 사람 검토 뒤에만 방송한다
    why: 나쁜 소식이 있는 날 시스템이 스스로 결론을 내면 안 된다.

# ─────────────────────────────────────────────
# 2. 금지 표현 → 대체
# ─────────────────────────────────────────────
replacements:

  # 우열 판정
  - avoid: [밀린다, 뒤처진다, 앞선다, 열위, 우위, 완패, 압도]
    use: 양쪽 수치를 나란히 제시하고 판정어를 붙이지 않는다
    example:
      before: 증가율은 이노션이 세 지표 모두에서 높다
      after: 증가율은 제일기획 0.6퍼센트, 이노션 22.4퍼센트입니다

  - avoid: [꼴찌, 마지막, 후발, 뒤늦게, 따라간다, 수입했다]
    use: 시점만 나열한다
    example:
      before: 제일기획은 5사 중 마지막이다
      after: 다섯 곳이 넉 달 반 사이에 차례로 채택했습니다

  # 위기 프레이밍
  - avoid: [눌리고 있다, 위기, 부진, 추락, 급락, 구멍, 타격, 직격탄]
    use: 변화의 방향과 크기만 말한다
    example:
      before: 1분기의 구멍이 아직 메워지지 않았다
      after: 상반기 누적으로는 아직 감소분이 남아 있습니다

  - avoid: [범인, 원인은 ~다, ~때문이다, 책임]
    use: ~에서 설명된다 / ~로 나타난다
    example:
      before: 범인은 판관비 한 항목이었다
      after: 감소분은 판관비 증가에서 설명됩니다

  # 시장 평가
  - avoid: [저평가, 불신, 시장이 외면, 신뢰를 잃, 괴리가 크다]
    use: 수치를 제시하고 리포트 원문 인용으로 대신한다
    example:
      before: 대체당한 것은 밸류에이션이다
      after: 실적과 시장 평가 사이에 간격이 있습니다

  # 사내 대상
  - avoid: [닿지 못한다, 못 한다, 한계, 부족하다, 뒤떨어진]
    scope: 사내 도구·부서·산출물을 서술할 때
    use: 담당 영역이 다르다 / 설계 목적의 차이다
    example:
      before: 사내 LLM이 닿지 못하는 경계
      after: 커넥트 AI와 Claude의 역할 구분

  - avoid: [아무도 ~하지 않았다, ~한 사람은 없었다, 방치, 누락]
    scope: 사내 산출물을 서술할 때
    use: 이 표본에서는 확인되지 않았다 / 별도 자료가 필요하다
    example:
      before: 한국에서 어떻게 하는지를 말한 사람은 없었다
      after: 국내 실무 적용 사례는 이 표본에서 확인되지 않았습니다

  # 타사 대상
  - avoid: [사실이 아니다, 틀렸다, 과장이다, 허위]
    scope: 경쟁사 발표를 서술할 때
    use: 확인된 시점과 나란히 제시하고 판정하지 않는다

# ─────────────────────────────────────────────
# 3. 어미 규칙
# ─────────────────────────────────────────────
endings:
  fact:        [입니다, 했습니다, 늘었습니다, 줄었습니다]   # 1차자료로 확인된 것
  inference:   [로 보입니다, 로 나타납니다, 로 볼 수 있습니다]
  attributed:  [로 설명합니다, 라고 밝혔습니다, 로 전합니다]  # 출처의 말
  uncertain:   [아닙니다, 확인되지 않았습니다, 필요합니다]

  rule: 1차자료가 아닌 내용에 fact 어미를 쓰지 않는다

# ─────────────────────────────────────────────
# 4. 발행 게이트
# ─────────────────────────────────────────────
gates:
  - id: G1
    check: replacements 의 avoid 어휘가 대본에 있는가
    action: 있으면 대체 후 재검사. 대체 불가면 해당 문장 삭제

  - id: G2
    check: 1차자료 근거 없는 문장에 fact 어미가 쓰였는가
    action: inference 어미로 교체

  - id: G3
    check: 종합 판단·전망 문장이 있는가
    action: 사람 검토 전이면 삭제. 클로징은 "앞으로 확인할 지표"까지만

  - id: G4
    check: 사내 부서·팀·개인이 지목되었는가
    action: 조직 단위 서술로 일반화하거나 삭제

  - id: G5
    check: 수치가 완화·반올림되었는가
    action: 원본 수치로 복원 (P1 위반)

# ─────────────────────────────────────────────
# 5. 클로징 고정 형식
# ─────────────────────────────────────────────
closing:
  allow:
    - 앞으로 확인할 지표 나열
    - 다음 확인 시점 안내
    - 사용한 자료 출처 고지
  deny:
    - 전망 단정
    - 조언·훈수
    - 총평·평가

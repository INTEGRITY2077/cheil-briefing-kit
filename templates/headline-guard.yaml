# 헤드라인 판정 규칙
#
# insight-guard 는 무엇이 인사이트인가를 정한다.
# tone-guard 는 무엇을 말하지 않을지, style-guard 는 어떻게 쓸지 정한다.
# 이 파일은 **어느 요소가 무엇을 맡는가**를 정한다.
#
# 참조: jamditis/claude-skills-journalism 의 newsroom-style (MIT, Copyright (c) 2025 Joe Amditis)
#       — 원리 두 가지만 남겼다. 무판단(축소 적용), 리드 한 문장.
#       "행위자+동사"는 v1 에서 가져왔다가 v2 에서 뺐다. 아래 history 참조.
#       AP 스타일 조항은 한국어에 옮겨지지 않아 쓰지 않았다.
#
# 채택하지 않은 것:
#   전환 카피 계열 스킬(AIDA·PAS·BAB, 헤드라인 전환 잠재력 채점).
#   설득을 목표로 하면 편을 들게 되고, 사내 자료에서 그것이 공격으로 읽힌다.

version: 2

# ─────────────────────────────────────────────
# 용어 정의 — headline-guard · insight-guard 공통 문안 (두 파일 상단에 동일하게 둔다)
# ─────────────────────────────────────────────
terms:
  헤드라인(축):
    desc: 각 축 상단의 규명 서술. 그 축에서 무엇을 알아냈는지를 말한다
    governed_by: headline-guard 5절 형태 규칙 — S1(의문형 금지) 적용 대상
  화두(h1):
    desc: 문서 머리(masthead)의 h1. insight-guard 4-2절이 세우는 문서 단위 경향성(화두)의 지면 자리
    governed_by: insight-guard 4-2절. 축 헤드라인이 아니므로 S1 을 적용하지 않는다 — 의문형 허용
  조정:
    source: im-news-editor.yaml 2절 note — 이 조정의 원본
    rule: 축 헤드라인(규명 서술)은 S1 유지, 문서 화두(h1)와 매거진형 제목은 질문 허용

history:
  - version: 1
    outcome: 실패
    what: 헤드라인에 숫자 1개 이상을 강제하고 행위자+동사 문법을 요구했다
    why_failed: |
      숫자를 강제한 순간 헤드라인이 pull 박스와 같은 단계를 맡게 됐다.
      축 라벨 · 헤드라인 · pull 박스 셋이 「무엇과 무엇이 겨루나」를 세 번 말했다.
      결과물이 차트 캡션처럼 읽혔다.

      행위자+동사는 사건 보도용 문법이다. 축은 사건이 아니라 상태다.
      문법을 맞추려고 「회사가 927억과 △14.2%를 같은 표에 실었다」 같은
      가짜 행위자가 생겼다. 회사가 표를 실은 것은 사건이 아니다.

      무판단 규칙도 과했다. 걸러진 것은 평가가 아니라 읽기였다.
      v0 는 공격적이었고 v1 은 무의미했다. 같은 실수의 양 끝이다.
  - version: 2
    what: 지면 요소를 인지 단계에 1:1 로 붙이고, 헤드라인을 규명 단계로 옮겼다

# ─────────────────────────────────────────────
# 정의
# ─────────────────────────────────────────────
definition: |
  헤드라인은 그 축에서 무엇을 알아냈는지를 말한다.

  무엇이 겨루는지는 축 라벨과 pull 박스가 이미 말했다.
  헤드라인이 그것을 다시 말하면 지면이 같은 단계를 두 번 쓰는 것이다.
  헤드라인의 자리는 규명이다. 왜 어긋났는지, 혹은 왜 아직 모르는지.

# ─────────────────────────────────────────────
# 1. 역할 분해 — 한 단계에 한 요소
# ─────────────────────────────────────────────
roles:
  rule: 인지 단계마다 전담 요소를 하나만 둔다. 둘 이상이 같은 단계를 맡으면 둘 다 약해진다
  map:
    - stage: 1
      name: 무엇과 무엇이 겨루나
      owner: [축 라벨, pull 박스]
      note: 축 라벨은 영역 이름만 쓴다. pull 박스가 숫자를 전담한다
    - stage: 2
      name: 무엇이 예상과 어긋났나
      owner: [읽기 태그, reading 문단]
      note: 합의점·대척점·모순점. insight-guard 5절
    - stage: 3
      name: 왜 어긋났나
      owner: [헤드라인, resolve 박스]
      note: 헤드라인이 결론을 말하고 resolve 박스가 근거를 댄다. 반복이 아니라 주장과 근거
    - stage: 4
      name: 얼마나 말할 수 있나
      owner: [strength 줄]
  forbidden: 한 요소가 두 단계를 겸하는 것. 한 단계를 두 요소가 나눠 갖는 것

# ─────────────────────────────────────────────
# 2. 규명 유형이 문법을 정한다
# ─────────────────────────────────────────────
grammar:
  rule: 헤드라인 형태를 미리 정하지 않는다. 그 축의 규명 유형(insight-guard 3절)이 정한다
  by_outcome:
    - id: R1
      name: 원인 규명
      says: 차이를 만든 항목을 지목한다
      shape_hint: 무엇이 아니라 무엇 쪽이다 / 무엇이 무엇을 앞질렀다
      must: 지목한 항목이 resolve 박스의 항목과 같아야 한다
    - id: R2
      name: 착시 해소
      says: 비교가 성립하지 않았음을 선언한다
      shape_hint: 둘은 같은 자로 잰 것이 아니다 / 창을 바꾸면 결론이 바뀐다
      must: 무엇과 무엇의 정의가 다른지 본문이 받쳐야 한다
    - id: R3
      name: 미해소
      says: 모른다는 것과, 무엇이 있어야 알 수 있는지를 말한다
      shape_hint: 이 자료로는 나오지 않는다 / 무엇을 봐야 판정된다
      must: 보류 슬롯에 같은 항목이 있어야 한다
      note: |
        약해 보인다는 이유로 R3 를 R1 처럼 쓰지 않는다.
        모르는 것을 모른다고 쓴 자리가 나머지 축을 믿게 만든다.
  effect: |
    유형이 셋이므로 형태가 구조적으로 갈린다.
    v1 은 대구 반복을 규칙(H4)으로 막았다. v2 는 설계로 없앤다.
    같은 문서의 헤드라인이 전부 같은 형태라면 규명 유형을 잘못 붙였다는 신호다.

# ─────────────────────────────────────────────
# 3. 숫자
# ─────────────────────────────────────────────
numbers:
  in_headline:
    rule: 숫자를 넣지 않는다. 규명을 말하는 데 숫자가 필요하면 pull 박스가 이미 갖고 있다
    exception: 그 숫자 자체가 규명의 결론일 때만 허용한다
    exception_check: 숫자를 빼면 헤드라인이 성립하지 않는가. 성립하면 빼야 할 숫자다
  in_pull_box:
    rule: 겨루는 두 방향의 숫자를 여기 전부 싣는다
    must_be_in_ledger: true
    check: 각 숫자를 facts.jsonl 의 fact 필드에서 문자열로 찾을 수 있는가
    derived: 파생 계산은 pull 박스에 올리지 않는다. resolve 박스에서 과정과 함께 쓴다

# ─────────────────────────────────────────────
# 4. 판단의 경계
# ─────────────────────────────────────────────
judgment:
  rule: 읽기는 쓴다. 회사에 대한 평가는 쓰지 않는다
  note: v1 은 이 둘을 구분하지 않고 통째로 막아서 헤드라인이 할 일을 잃었다
  allowed:
    - 자료 사이의 관계에 대한 판단
    - 비교가 성립하는지에 대한 판단
    - 무엇을 아직 모르는지에 대한 판단
  forbidden:
    - subject: 회사·부문·경영진을 주어로 놓은 평가
      example: 회사가 대응에 실패했다 / 판단이 늦었다
    - subject: 동종사와의 우열
      example: 어디가 앞서고 어디가 뒤진다
    - subject: 예측
      example: 앞으로 어떻게 될 것이다
  test: 주어가 회사인가. 그렇다면 서술어가 사실인가 평가인가

# ─────────────────────────────────────────────
# 5. 형태
# ─────────────────────────────────────────────
shape:
  max_chars: 30
  lede: 헤드라인 아래 첫 문장은 하나다. 배경이 아니라 규명의 근거를 담는다
  forbidden_patterns:
    - id: S1
      name: 의문형
      limit: 0
      why: 답을 아는데 묻는 것은 독자를 시험하는 것이다
      scope: |
        축 헤드라인 전용. 문서 화두(h1)와 매거진형 제목에는 적용하지 않는다.
        상단 용어 정의·im-news-editor.yaml 2절 조정 참조 — 충돌이 아니라 적용 범위가 갈린 것이다.
    - id: S2
      name: 추상 명사 종결
      shape: "~의 재편 / ~에 대한 대응 / ~의 구조"
      why: 명사화는 동사를 지운다. style-guard F 계열
    - id: S3
      name: 의인화 주어
      shape: 용어·지표·기술을 주어로 놓고 사람의 동사를 붙이는 것
      why: style-guard D-5
    - id: S4
      name: pull 박스 재진술
      shape: 헤드라인의 내용이 바로 아래 pull 박스로 환원되는 것
      why: v1 의 실패 지점. 같은 단계를 두 번 쓰는 것

# ─────────────────────────────────────────────
# 6. 복수 안
# ─────────────────────────────────────────────
options:
  rule: 헤드라인은 고위험 요소다. 한 개를 내고 끝내지 않는다
  min_per_slot: 3
  generate_from: 규명 유형이 정해진 다음에 뽑는다. 형태를 먼저 정하고 내용을 맞추지 않는다
  selection: 선택 근거를 한 줄로 남긴다. 탈락안은 logged 로 남긴다
  warning: |
    게이트는 빼는 도구다. 좋은 문장을 만들지 않는다.
    가장 좋은 안이 게이트에 걸려 죽었다면 규칙이 잘 도는 것이 아니라 잘못 조준된 것이다.
    그럴 때는 안을 버리지 말고 규칙을 의심한다.

# ─────────────────────────────────────────────
# 7. 문서 머리
# ─────────────────────────────────────────────
masthead:
  h1:
    rule: 제목은 **대상 회사에 무슨 일이 있었나**를 한마디로 말한다. 지면의 방법이나 수집 상태를 쓰지 않는다
    max_chars: 20
    superseded_2026_08_12: |
      종전 조항: "제목은 문서의 방법을 한마디로 말한다. 주제를 반복하지 않는다"
      철회 근거 — 이 조항은 insight-guard 4-2 가 같은 h1 자리에 배정한 화두 결론 칸
      ("이 창에서 무슨 일이 있었나")과 정면으로 충돌했다. 한 자리에 '방법'과 '무슨 일'이
      동시에 배정돼 있었고, 설치자가 '방법' 쪽을 정직하게 지켜 두 호가 반려됐다:
        「제일기획이 조용한 날, 시장의 단가는 어디로 갔나」 (수집 결과의 부재 = 방법)
        「AI가 실적자료에 처음 올랐다」                    (PDF 단어 세기 = 방법)
      원작자의 발행본 두 호는 둘 다 '무슨 일'이었다 —
        「무게중심이 옮겨가고 있다」 · 「폴더블 사전판매 144만대 — 역대 최다」
      즉 실물은 '무슨 일'로 나가고 있었고 문서만 '방법'이라고 적혀 있었다.
      "주제를 반복하지 않는다"는 kicker·standfirst 와의 중복 회피 취지였으나,
      그 취지는 아래 no_repeat 로 옮겨 좁힌다.
    no_repeat: kicker(연간 주제)·standfirst 의 문구를 그대로 되풀이하지 않는다. 소재가 같은 것은 반복이 아니다
    forbidden:
      - 수집·계량 과정 — "처음 등장했다" "N회 나왔다" "신규 0건" "확인되지 않았다"
      - 부재 자체 — 무엇이 없다는 사실은 근거이지 화두가 아니다 (insight-guard I12)
      - 원장 등급 어휘 — "1차자료" "증권사" 는 내부 어휘다 (publish-checklist B1)
    concreteness:
      source: issue #18 — 2026-08-12 세 번 연속 반려. 세 번 다 같은 자리에서 추상어로 접혔다
      rule: |
        압축 ≠ 추상화. 압축은 구체어(사물·수·행동)를 남기고 설명을 덜어내는 것이지,
        구체어를 지우고 개념을 남기는 것이 아니다. 후자는 카피가 아니라 명제가 된다.
        헤드는 구체형이거나, 추상형이면 **바로 다음 줄(answer2/standfirst)이 즉시
        구체로 받을 때만** 허용한다. 헤드와 받는 줄이 둘 다 추상이면 실패.
      concrete_markers:      # 하나 이상 있어야 구체형으로 본다
        - 구체 수치 — 단위 붙은 수·비교값 (예. 144만대, 927억, −37.6%)
        - 고유명사 — 제품·회사·자료 이름. 원장(okf/facts) fact 본문에 등장하는 이름
        - 회사가 한 구체 행동 — 동사가 회사의 행위
      abstract_only_examples:  # 이것만으로 이뤄진 헤드는 추상형
        - 관계어 — 밖에·쪽으로·무게중심·전환·재편·계열/비계열
        - 상태어 — 조용한·잠잠한·변화 없는
        - 서지어 — 처음 등장·N회 나옴·신규 0건·확인되지 않음
      background_test: |
        검사법 — 배경 지식 0 독자가 헤드(+ 바로 다음 한 줄)만 읽고
        「무슨 일이 있었는지」 한 문장으로 말할 수 있는가. 못 하면 실패.
      layering: |
        층위 배치 — 서지 사실·부재·수집 과정은 헤드의 재료가 아니라 근거 한 줄의
        재료다. 같은 사실을 원작자 08-11호는 gist2 셋째 줄로 처리했다:
        「전환은 실행 단계다 — AI 제작 캠페인·GEO·사내 AI·솔루션 사업 준비까지
        확인된다. 다만 그 숫자는 아직 공시에 없다.」
        설치자 호 B 는 같은 사실(「AI 솔루션 첫 등장」·「금액은 아직 없다」)을
        헤드로 올려 반려됐다. 같은 재료, 다른 층위 배치다.
      evidence:
        passed:
          - 「폴더블 사전판매 144만대 — 역대 최다」(08-12) — 구체형. 헤드 단독 성립
          - 「무게중심이 옮겨가고 있다」(08-11) — 추상형이나 answer2 가 즉시 구체로
            받는다. 「고객은 북미와 비계열로, 일하는 방식은 AI로. 상반기 숫자와
            업계의 말이 같은 방향을 가리킨다」 — 헤드가 문을 열고 다음 줄이 현금화한다
        rejected:  # 2026-08-12 반려 3건 — 반례
          - 「제일기획이 조용한 날, 시장의 단가는 어디로 갔나」 — 상태를 접었다. 구체어 0
          - 「AI가 제일기획 실적자료에 처음 올랐다」 — 서지 사실을 접었고, 받는 줄
            (「직전 다섯 분기 자료에 한 번도 없던 단어가 2분기 자료 한 면을 채웠다」)도
            또 서지 사실 — 헤드도 받는 문장도 회사가 무엇을 하는지 말하지 않는다
          - 「제일기획, AI를 계열 밖에 판다」 — 관계를 접었다. 「계열」은 매출 64.5%가
            삼성 계열이라는 배경을 아는 사람만 읽는 말. 받는 줄도 없음 — 정보량 0
      static_check:  # check_insight.py H9 가 읽는 값 — 정적으로 가능한 부분만
        receiving_line: [answer2, standfirst]  # h1 을 받는 줄의 class 후보 (문서 첫 번째)
        non_signal:  # 원장에 있어도 구체 신호로 세지 않는 말 — 반려 3건 실측에서 채집
          - 제일기획   # 자기 회사명 — 모든 호에 있어 배경 0 독자에게 정보량 0
          - 제일
          - AI         # 일반 기술어 (반려 호 B·B' 실측)
          - 계열       # 관계어 — 배경 의존 (반려 호 B' 실측)
          - 비계열
          - 시장       # 일반명사 (반려 호 A 실측)
          - 자료       # 서지어 재료 (반려 호 B answer2 실측)
          - 실적자료
          - 단어
        note: |
          시간어(N분기·상반기·전년…)와 단위 없는 맨 숫자는 신호로 세지 않는다 —
          H6 추출 규칙과 같은 취지(미탐을 택하고 오탐을 피한다). 사람 판정의 정본은
          background_test 이고, H9 정적 판정은 그 근사다.
    note: |
      이 h1 이 화두(h1)다 — 상단 용어 정의 참조. 축 헤드라인이 아니므로
      5절 S1(의문형 금지)을 적용하지 않는다. 의문형 허용 (im-news-editor.yaml 2절 조정).
  lead_block:
    rule: 두괄식. 각 축에서 알아낸 것을 한 줄씩 먼저 놓는다
    content: 헤드라인과 같은 단계(규명). 숫자 나열이 아니다
    max_chars_per_line: 40

# ─────────────────────────────────────────────
# 8. 게이트
# ─────────────────────────────────────────────
gates:
  - id: H1
    check: 각 지면 요소가 인지 단계 하나만 맡고 있는가. 겸임이나 분할이 없는가
  - id: H2
    check: 헤드라인이 규명을 말하는가. 겨루는 두 방향의 재진술이 아닌가
  - id: H3
    check: 헤드라인의 규명 유형이 resolve 박스의 R 판정과 같은가
  - id: H4
    check: 문서 안에 R 유형이 둘 이상 있는데 헤드라인 형태가 전부 같지 않은가
  - id: H5
    check: 헤드라인에 회사를 주어로 한 평가가 없는가
  - id: H6
    check: pull 박스의 숫자가 전부 ledger 문자열인가. 파생값이 올라가지 않았는가
  - id: H7
    check: 30자 이하인가. 리드가 한 문장인가
  - id: H8
    check: 슬롯마다 3안 이상 냈고 탈락안이 기록에 남았는가
  - id: H9
    check: |
      화두(h1)가 구체형인가. 추상형이면 바로 다음 줄(answer2/standfirst)이 즉시
      구체로 받는가 (masthead.h1.concreteness). 정적 부분 — h1 과 받는 줄에 구체
      신호(단위 붙은 수 / 원장 fact 고유명사)가 둘 다 0이면 실패 — 은 check_insight.py 가
      판정하고, background_test 는 사람 판정(eval/)이다. issue #18

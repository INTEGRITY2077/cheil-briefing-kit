# 추적 대상 프로파일 — 제일기획
#
# 다른 회사를 추적하려면 이 파일만 새로 쓴다.
# 킷의 나머지는 손대지 않는다.

version: 1

target:
  name: 제일기획
  name_en: Cheil Worldwide
  ticker: "030000"
  dart_query: 제일기획
  peers: [이노션]
  global_peers: [WPP, Omnicom, Publicis, Dentsu]
  major_client: 삼성전자

# ─────────────────────────────────────────────
# 독자 — 무엇이 뉴스인지 가르는 기준선
# ─────────────────────────────────────────────
# 2026-08-12 신설.
# 종전에도 독자 선언은 있었다 — templates/tone-guard.yaml:11 `audience: 사내 구성원`,
# 같은 파일 6~7행 「독자는 이 회사에서 일하는 사람이다. 외부 평가자가 아니라 당사자에게
# 필요한 정보를 준다」. 그러나 그 선언은 **톤 가드 안에 말투 파라미터로만** 있었고,
# 무엇을 뉴스로 고를지에 관여하는 조항이 0건이었다(tone-guard 게이트 G1~G5 는 전부
# 어휘·어미·수치 표기 검사다). 그 공백에서 실행자는 「어느 자료가 센가」(grade)를
# 「독자에게 무엇이 중요한가」의 대용으로 썼고, 두 호 연속 자료 계량이 헤드로 올라갔다
# (「제일기획이 조용한 날」 / 「AI가 실적자료에 처음 올랐다」 — 둘 다 반려).
#
# 이 블록은 그 선언을 **선별 기준으로 승격**시킨 것이다. tone-guard 의 audience 는
# 톤 판정에 그대로 쓰고, 무엇을 뉴스로 고를지는 여기를 본다.
# insight-guard 3-2절(함의)이 「누구에게의 함의인가」를 이 블록에서 읽는다.
# 2026-08-13 주어 정정: 「의사결정을 하는 사람들」→「의사결정을 이루는 팀」.
# 권한자 개인이 아니다 — 결정을 준비하고 받치는 팀이 독자다. 문안은 보존, 주어만 정정.
# insight-rubric R1·R2 앵커(팀에게 걸린 것·팀 동사)와 insight-guard audience_filter 판정 문장이 이 정의를 따른다.
audience:
  who: 제일기획의 의사결정을 이루는 팀 (권한자 아님)
  not: 특정 부서·팀·직능. 실무 지침이 아니라 회사 단위 판단에 쓰인다
  purpose: 기업의 의사결정 흐름에 대한 객관화
  what_it_means: |
    이 브리핑은 뉴스 요약이 아니라, 회사가 내리고 있거나 내려야 할 결정을
    바깥 공개자료 위에 놓아 좌표를 찍는 도구다. 안에서 보면 주관적인 결정 흐름을
    외부 자료로 객관화한다.
  page_question: |
    지면이 답해야 하는 질문은 「오늘 무슨 일이 있었나」가 아니라
    「지금 우리가 어떤 결정 흐름 위에 있고, 그것이 바깥 자료에서 어떻게 보이나」다.
  coordinates:            # 결정을 객관화할 때 채우는 좌표. 전부 채울 필요는 없다
    - 왜 필요한 결정인가        # 무엇이 이 결정을 밀어붙이는가
    - 어떤 여건에서 내렸나      # 실적·구조상의 제약
    - 결정하지 않으면 무엇이 오나
    - 남들은 어디까지 갔나      # 지주·경쟁사·침입자의 같은 결정
    - 우리 결정은 어디까지 왔나  # 계획인가 계약인가 매출인가
  out_of_scope:
    - 투자자용 좌표를 그 자체로 뉴스 삼는 것 — 목표주가·이익 추정·배당·자사주.
      시장이 회사 계획에 매긴 값으로 인용할 수는 있으나 헤드·화두가 되지 않는다
    - 수집·계량 과정을 지면에 올리는 것 — 「자료에 몇 번 나왔다」는 근거이지 뉴스가 아니다
    - 부재 자체를 헤드로 올리는 것 — 「신규 0건」은 결정 흐름의 관측치로만 쓴다

# ─────────────────────────────────────────────
# 티어 정의
# ─────────────────────────────────────────────
tiers:
  T1: { desc: 의사결정 직결. 정기·캘린더 기반, eval_score: 5 }
  T2: { desc: 보조. 비정기 폴링,                eval_score: 2 }
  T3: { desc: 콘텐츠·담론. 마감 기반,           eval_score: 1 }

# ─────────────────────────────────────────────
# 소스
# ─────────────────────────────────────────────
# last_checked / last_item 은 실행할 때마다 갱신된다.
#
# cadence (2026-08-15 이슈 #36 신설) — 이 소스를 **언제 도는가**의 정본이다.
# 어휘는 넷: 매일 · 주간 · 월간 · 연간. (영문 daily/weekly/monthly/annual 도 같은 뜻으로
# 읽힌다 — 다른 프로파일이 영문으로 쓸 수 있어서다.) 자유서술 주기(예: 「월 하순에
# 1~3편 묶음」)는 cadence 가 아니라 cadence_note 로 내린다 — 기계가 읽는 칸은 한 어휘여야 한다.
#
# 왜 구분이 필요한가: `check_run` 이 **산출물이 실존하는 날** cadence: 매일 인 소스
# 전수의 last_checked 가 그날인지 대조한다(소스 로스터 봉인, 이슈 #36). 연간·월간 소스를
# 같이 세면 매일 실패가 나서 봉인 자체가 무력해진다.
#
# 부여 근거 — 2026-08-15 재기술(검수 문제 16 수리). 종전 문안은 실측과 어긋났다:
#   own-magazine 을 「그날 스윕과 함께 움직이지 않았다」로 적고 월간을 부여했는데,
#   이 파일의 own-magazine 은 last_checked: 2026-08-14 이고 last_item 이
#   "2026.07.24 /58457 (08-14 신규 0건)" 이다 — 08-14 스윕과 **함께 움직였고**,
#   저자가 매일 판정의 증거로 든 「신규 0건」 표식까지 그대로 있다(ir-results 는
#   같은 증거로 '매일'을 받았다). 같은 증거·반대 결론을 실측으로 포장한 것이라 정정한다.
#
#   실측 그대로:
#   - last_checked 2026-08-14 (08-14 스윕과 함께 움직인 소스) — dart-target ·
#     ir-events · ir-results · broker-reports · trade-press · client-newsroom ·
#     global-peers · global-demand · ai-ad-supply · **own-magazine** 열 개.
#   - last_checked 2026-08-10 에 정지 — ad-market-stats · own-channels **둘뿐**이다.
#   - last_item 에 「신규 0건」 계열 표식이 있는 것은 ir-events · ir-results ·
#     broker-reports · global-peers · global-demand · own-magazine 여섯. 나머지
#     dart-target · trade-press · client-newsroom · ai-ad-supply 는 실제 항목이 적혀 있다.
#     (종전 문안의 「아홉은 신규 0건까지 남아 있다」 는 과장이었다.)
#
#   그래서 cadence 는 last_checked 분포만으로 정하지 않는다 — 그 값은 「그날 스윕이
#   무엇을 열었나」의 자기 보고일 뿐이다. 부여 기준을 둘로 나눠 명시한다:
#   ① 소스가 **새 항목을 낼 수 있는 주기** (발행 주기) — own-magazine 은 월 하순
#      묶음 발행이라 월간, ad-market-stats 는 연간 통계라 연간.
#   ② 매일 여는 것이 **관측으로 의미가 있는가** — own-channels 는 08-10 이후 정지로
#      매일 대조 대상에 올리면 관측이 아니라 상시 실패를 만든다(주간).
#   나머지 아홉은 두 기준 모두 매일이다. own-magazine 이 08-14 에 함께 열린 것은
#   사실이고, 그렇다고 매일 대조 대상이 되는 것은 아니다 — 대조가 요구하는 것은
#   「매일 열려야 한다」이지 「매일 열렸다」가 아니다.
#
# 예외 표기(F5 정직성): 장애·휴무로 그날 못 돈 소스는 조용히 두지 말고 last_item 에
#   「건너뜀 YYYY-MM-DD — 사유」 를 남긴다. 그러면 게이트가 차단 대신 경고로 강등한다.

# ─────────────────────────────────────────────
# 소스 로스터 봉인의 판정 값 (2026-08-15 신설 — 검수 문제 6 수리)
# ─────────────────────────────────────────────
# 왜 여기 있는가: 종전 `check_run.load_sweep_roster()` 는 `if cad in ("매일","daily")`
# 로 **어휘 집합을 코드에 박았다**. 정본에 없는 값(예: `cadence: 상시`, `cadence:
# 매일(평일)`)이 들어오면 그 소스가 로스터에서 **조용히 빠지고 게이트는 초록으로
# 통과했다** — 실패가 시끄럽지 않고 봉인이 약해지는 방향이다. 규율 ② 위반이라
# 어휘를 정본으로 내리고, 도구는 이 값을 읽어 판정만 한다.
sweep_gate:
  enabled: true                 # false 로 끄려면 disabled_reason 을 함께 적어야 한다
  # disabled_reason: <끄는 사유>  # enabled: false 일 때 필수 — 조용히 꺼지지 않게
  daily_cadence: [매일, daily]  # 상시 대조 대상 어휘
  known_cadence: [매일, 주간, 월간, 연간, daily, weekly, monthly, annual]
  # known_cadence 밖의 값(빈 값 포함)은 **차단**한다. 종전처럼 조용히 빼지 않는다.
  # 또 daily_cadence 에 해당하는 소스가 0건이면 차단한다 — 그러지 않으면 정본에서
  # `cadence: 매일` 을 전부 지우는 것만으로 봉인을 끌 수 있었다(검수 문제 6 후단).

sources:

  - id: dart-target
    tier: T1
    cadence: 매일
    name: DART 공시
    method: rss
    url: https://dart.fss.or.kr/api/todayRSS.xml
    filter: creator == target.name
    fields: [title, link, category, pubDate, creator]
    backup:
      url: https://dart.fss.or.kr/dsab007/main.do
      when: RSS 50건을 넘겨 밀렸을 가능성이 있을 때. 실적 발표일처럼 공시가 몰리는 날
    forbidden:
      # robots.txt Disallow. 자동 수집 대상에서 제외한다
      - /dsaf001/main.do
      - /report/viewer.do
      - /report/download.do
      - /pdf/download/
      - /dsae001/selectPopup.ax
      - /html/search/SearchCompany_M2.html
    note: |
      보고서 원문 뷰어는 robots.txt 가 막는다. 자동으로 열지 않는다.
      원문이 필요한 항목은 ir-results 로 대체하고,
      계열 비중과 거래처별 실수치는 분기 1회 사람이 화면으로 확인한다.
    watch:
      - 결산실적공시예고            # 분기 전면판 트리거
      - 연결재무제표기준영업(잠정)실적
      - 분기보고서
      - 반기보고서
      - 사업보고서
      - 기업설명회(IR)개최
    report_sections:               # 분기보고서에서 볼 목차
      - 4. 매출 및 수주상황
      - 2-2. 연결 포괄손익계산서
      - 24. 부문별 정보
      - 25. 특수관계자 및 특수관계자와의 주요거래
    last_checked: 2026-08-14
    last_item: "2026.08.14 반기보고서 (2026.06) 접수 (F-056) · 08.13 지급수단 공시 (F-058)"

  - id: ir-events
    tier: T1
    cadence: 매일
    name: IR Events
    url: https://www.cheil.com/kr/ir/
    method: Upcoming 표에서 예정 일정을 뽑아 agenda 로 적재
    last_checked: 2026-08-14
    last_item: "Upcoming 표 변동 없음 — Asia Conference(08-11~14) 마지막 날, 신규 일정 0건"

  - id: ir-results
    tier: T1
    cadence: 매일          # 발표 자체는 분기지만 목록 확인은 매일 돌았다(08-14 「신규 0건」)
    name: 실적발표자료
    url: https://www.cheil.com/kr/ir/financials/result
    note: PDF 직링크 규칙이 연도 경계에서 바뀐다. 목록에서 링크를 읽고, 경로를 만들어 쓰지 않는다
    last_checked: 2026-08-14
    last_item: "2026년 2분기 (08-14 신규 0건)"

  - id: broker-reports
    tier: T1
    cadence: 매일
    name: 증권사 리포트
    url: https://consensus.hankyung.com/analysis/list?skinType=business
    method: 기간 지정 후 회사명 검색. PDF 는 downpdf?report_idx= 로 열린다
    note: 지역별 성장률과 해외 비계열 비중은 여기에만 있다
    last_checked: 2026-08-14
    last_item: "2026.07.27 유진투자증권 (08-01~08-14 신규 0건)"

  - id: ad-market-stats
    tier: T1
    name: 광고시장 통계
    cadence: 연간          # 종전부터 명시돼 있던 값 — 매일 대조 대상이 아니다(이슈 #36)
    url:
      - https://www.kobaco.co.kr/
      - https://www.ad.co.kr/
      - https://www.index.go.kr/
      - https://kaa.or.kr/
    last_checked: 2026-08-10

  - id: trade-press
    tier: T2
    cadence: 매일
    name: 업계 매체
    url:
      - https://www.brandbrief.co.kr/
      - https://www.madtimes.co.kr/
    method: 첫 화면 목록에서 신규분. 경쟁사 실적과 시장 구조 변화를 먼저 본다
    last_checked: 2026-08-14
    last_item: "2026-08-14 버슨 림빅 인수 (F-060) · 08-13 세일즈포스 AI 커머스 조사 (F-062)"


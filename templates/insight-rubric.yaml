# 정성 심사 루브릭 — 6차원 × 10점 (v1 은 5차원 — R6 는 v2 신설, since: 2)
#
# insight-guard 는 무엇이 인사이트인가를 정하고, publish-checklist 의 기계 게이트는
# 존재·계약을 판정한다. 이 파일은 그 사이의 **정성 심사**를 정한다 — 규정을 전부
# 지키고도 「정돈된 자료 목록」으로 나오는 지면(2026-08-12 두 호 연속 반려)을
# 사람 눈 셋으로 막는다. 심사 기록 양식은 templates/review-form.md.
#
# 프로토타입 v0 — 편집장 승인 골격. 차원·앵커의 개정은 편집장 승인을 거친다.
#
# v2 (2026-08-13 편집장 지시) — 세 가지 개정:
# ① 독자 재정의 — 독자는 「제일기획의 의사결정을 이루는 팀」이다(권한자 아님).
#    정본은 profiles/cheil.yaml audience. R1 은 팀에게 걸린 것을, R2 는 팀 동사를 본다 —
#    「판단하라·결정하라」는 권한자의 동사라 팀 함의로 인정하지 않는다.
# ② R3 앵커에 큰축 장부(okf/axes.md) 대조 추가 — 교차는 우연이 아니라 설계에서 나온다.
# ③ R6 카피 인테그리티 신설 — 헤드라인 명사의 실존, 한 호흡, 독자(팀) 주어.
#    앵커 사례는 2026-08-13 화두 계보 실측.

version: 2

# ─────────────────────────────────────────────
# 황금률 — 이 심사의 경계
# ─────────────────────────────────────────────
golden_rule: |
  정량은 사람이 다시 보지 않고, 정성은 기계가 대신 답하지 않는다.
  기계(check_review)가 봉인하는 것은 세 가지뿐이다 —
  심사 기록의 실존, 임계 판정, 지적 항목의 처리(반영/기각) 완결.
  점수 자체를 기계가 매기는 순간 이 루브릭은 죽은 게이트가 된다.

# ─────────────────────────────────────────────
# 1. 차원 — 6차원 × 10점
# ─────────────────────────────────────────────
# anchor_10 / anchor_4 는 채점 기준점이다. 사이 점수는 심사자가 보간한다.
# floor 는 그 이하로 떨어지는 전형 사례 — 발견되면 앵커와 무관하게 해당 점수 이하.
dimensions:
  - id: R1
    name: 이해관계 계량
    question: 화두의 사건이 독자(제일기획의 의사결정을 이루는 팀)에게 해당되는지, 얼마가 걸렸는지가 원장 사실로 계량됐는가
    anchor_10: |
      해당 여부와 걸린 크기가 원장(okf/facts) 수치로 계량 완결됐다.
      팀에게 걸린 것 = 담당 캠페인 해당 여부 · 준비 안 된 채 질문받는 리스크 —
      「회사에 중대하다」가 아니라 「우리 팀 일에 닿는다」가 계량 대상이다
    anchor_4: 해당된다는 주장은 있으나 크기를 추정으로 때웠다
    floor:
      score_max: 2
      desc: 좌표 없는 긴박감 — 얼마가 걸렸는지 없이 「중대하다」만 있는 화두

  - id: R2
    name: 함의 실행가능성
    question: 함의 중 최소 1개가 「오늘 내릴 수 있는 판단」인가
    anchor_10: |
      독자가 오늘 실행할 수 있는 판단형 함의가 존재한다.
      함의의 동사는 팀 동사다 — 확인·대조·초안·답 준비.
      「판단하라·결정하라」는 권한자의 동사이지 팀 동사가 아니므로 그 자체로 기각 사유 —
      팀은 결정을 내리는 게 아니라 결정이 오기 전에 답을 준비한다
    anchor_4: 전부 조건부·미래형 — 「~하면 ~해야 한다」「~할 때가 온다」
    floor:
      score_max: 2
      desc: 전원 유보 — 「쌓이면」「드러나면」「재료다」로만 끝나는 함의 목록

  - id: R3
    name: 축 교차
    question: 두 축 이상을 잇는 문장이 있고, 그것이 각 절 단독으로는 못 하는 주장인가
    anchor_10: |
      교차 명제가 화두급이다 — 그 문장이 지면의 등뼈다.
      작은축 둘이 같은 큰축에 꽂히면 교차는 우연이 아니라 설계에서 나온다 —
      큰축 장부(okf/axes.md)를 대조해 소속 큰축이 같은지부터 본다
    anchor_4: 주제 우산만 공유하는 병렬 나열 — 절을 섞어도 주장이 안 변한다
    floor:
      score_max: 2
      desc: 교차 문장 0개 — 1~2점

  - id: R4
    name: 새로움
    question: 화두·판단이 전일 호와 논리적으로 독립인가
    anchor_10: 판단 구조까지 새롭다 — 전일 호를 지워도 이 호가 성립한다
    anchor_4: 화두만 바뀌고 판단 구조는 관성이다
    floor: ~   # 전형 사례 미규정 — anchor_4 이하는 심사자 보간

  - id: R5
    name: 근거-주장 정합
    question: 어미 강도가 근거 등급 사다리(1차자료=단정 · 보도=관찰 · 추정=여지)와 맞는가 (insight-guard 6절)
    anchor_10: 전 문장이 사다리를 지킨다
    anchor_4: 화두급 문장에서 어긋난다 — 보도 근거에 단정 어미
    floor: ~

  - id: R6
    name: 카피 인테그리티
    since: 2   # v2 신설 — v1 기록(R1~R5)에는 요구하지 않는다 (check_review 버전 스코핑)
    question: 헤드(화두 h1)의 명사가 본문·원장에 실존하고, 한 호흡에 읽히며, 독자(팀)가 주어인가
    anchor_10: |
      헤드의 명사는 전부 본문·원장(okf/facts) 실존 명사다 — 발명 은유·내부어 0건.
      한 호흡에 읽히고, 독자(팀) 주어가 우선한다.
      명사는 실존만으로 부족하다 — **실물**(사물·문서·회사·행동)이어야 한다.
      앵커 사례 — 2026-08-13~14 화두 계보 실측:
        「판단 좌표가 먼저 도착했다」 → 기각 (내부어·추상화)
        「답보다 마감이 먼저 왔다」 → 기각 (발명 은유 — '마감'이 본문·원장에 없다)
        「챗GPT 광고 넣자는 말, 나오면 뭐라고 답할 건가」 → 통과 (팀 주어)
        「광고 자본은 GPT로 움직이는가 — 답의 한 조각이 우리 손에 있다」 → 낙점 (큰축 승격)
      # 6단(2026-08-14 반려): 「챗GPT 광고를 잰다」 — 재다는 실존 어휘지만
      #   목적어 연어(광고 "효과/성과"를 재다)를 깎아낸 압축이 자연어 경계를 넘었고,
      #   음성(잽니다)에서 오독된다. 규정: 압축이 목적어·연어 경계를 넘으면 실존
      #   어휘라도 기각 — 소리 내 읽어 오독되면 즉시 기각. 낙점: 「챗GPT 광고 성과를 측정한다」
        「전환의 값은 세계가 먼저 매겼다 — 우리 증거는 오늘이 법정기한인
        반기보고서부터다」 → 기각 (개념어 배열 — 명사가 전부 실존하나 전부 개념어이고
        사건이 없다. 패널 8.0 vs 편집장 반려, 2026-08-14 — 실존 판정만으로는 요약문과
        카피를 못 가른다는 실측. 길이의 정적 상한은 headline-guard brevity 가 맡는다)
    anchor_4: |
      명사는 실존하나 두 호흡이거나, 주어가 회사·자료·시장 등 3인칭에 머문다.
      명사가 전부 개념어(전환·값·구조·증거류)면 실존해도 요약문이지 카피가 아니다 —
      anchor_4 이하 (2026-08-14 편집장 반려)
    floor:
      score_max: 2
      desc: 발명 은유·내부어가 헤드에 있다 — 본문·원장 어디에도 없는 명사로 지은 헤드

# ─────────────────────────────────────────────
# 2. 임계
# ─────────────────────────────────────────────
threshold:
  value: 7.0        # 시작값 — config review.threshold 가 우선. 이 파일 값은 config 부재 시 기본값
  basis: 3심사자(panel) 평균. 차원 평균 → 심사자 점수 → 3인 평균 순으로 접는다

# ─────────────────────────────────────────────
# 3. 패널 — 3렌즈
# ─────────────────────────────────────────────
# 렌즈는 분업이지 배점 독점이 아니다 — 전 심사자가 6차원 전부를 채점하되,
# 자기 렌즈의 차원에서 발견한 결함은 지적 목록에 반드시 올린다.
panel:
  - id: reader
    name: 독자 렌즈
    focus: [R1, R2, R6]
    desc: 독자(의사결정을 이루는 팀)의 자리에서 읽는다 — 내 팀 일에 닿나, 오늘 무엇을 확인·준비할 수 있나, 헤드가 내 말로 읽히나
  - id: refuter
    name: 반증 렌즈
    focus: [R5, R1]
    desc: 무담보 탐지 — 근거보다 센 어미, 계량 없는 긴박감을 찾아 무너뜨린다
  - id: crosser
    name: 교차 렌즈
    focus: [R3, R4]
    desc: 축 사이와 호 사이를 본다 — 교차 명제가 실재하나, 전일 호의 관성이 아닌가

# ─────────────────────────────────────────────
# 4. 미달 경로
# ─────────────────────────────────────────────
# 2026-08-14 언어 통일 (이슈 #30) — 편집 3단 신설(2026-08-13) 때 이 절의 「재조판」이
# 구 해석(지면 전면 재조판)인 채 남아, 3b 의 「뼈대 수정 몇 바퀴든」과 상충했다.
# 통일: 심사는 중도금(뼈대)에서 돌므로 미달 시 수정 대상은 뼈대다 — 중도금 루프는
# 분 단위라 횟수 제한이 없다. 「1회 한정」은 잔금(발행) 이후의 소급 재조판에만 적용한다.
fail_path:
  - step: 뼈대 수정 (중도금 루프)
    rule: |
      임계 미달이면 지적 목록을 반영해 뼈대(중도금 MD)를 수정한다.
      중도금 루프는 분 단위 비용이라 횟수 제한이 없다 (pipeline-three-stage ②).
      발행(잔금) 이후 소급 심사에서 미달이 났을 때의 재조판만 1회에 한한다.
  - step: 재심사
    rule: 수정본을 같은 패널이 다시 채점한다. review-form 의 재심사 섹션에 기록
  - step: 발행+보고
    rule: |
      재심사도 미달이면 발행하되 보고에 「정성 미달 N점」을 명기한다.
      매일 나가는 브리핑이다 — 정성 미달은 발행 중단 사유가 아니라 보고 사항이다
      (eval-rubric 머리말과 같은 원칙: 0점인 날에도 방송은 나간다).

# 정성 심사 루브릭 — 5차원 × 10점
#
# insight-guard 는 무엇이 인사이트인가를 정하고, publish-checklist 의 기계 게이트는
# 존재·계약을 판정한다. 이 파일은 그 사이의 **정성 심사**를 정한다 — 규정을 전부
# 지키고도 「정돈된 자료 목록」으로 나오는 지면(2026-08-12 두 호 연속 반려)을
# 사람 눈 셋으로 막는다. 심사 기록 양식은 templates/review-form.md.
#
# 프로토타입 v0 — 편집장 승인 골격. 차원·앵커의 개정은 편집장 승인을 거친다.

version: 1

# ─────────────────────────────────────────────
# 황금률 — 이 심사의 경계
# ─────────────────────────────────────────────
golden_rule: |
  정량은 사람이 다시 보지 않고, 정성은 기계가 대신 답하지 않는다.
  기계(check_review)가 봉인하는 것은 세 가지뿐이다 —
  심사 기록의 실존, 임계 판정, 지적 항목의 처리(반영/기각) 완결.
  점수 자체를 기계가 매기는 순간 이 루브릭은 죽은 게이트가 된다.

# ─────────────────────────────────────────────
# 1. 차원 — 5차원 × 10점
# ─────────────────────────────────────────────
# anchor_10 / anchor_4 는 채점 기준점이다. 사이 점수는 심사자가 보간한다.
# floor 는 그 이하로 떨어지는 전형 사례 — 발견되면 앵커와 무관하게 해당 점수 이하.
dimensions:
  - id: R1
    name: 이해관계 계량
    question: 화두의 사건이 독자(제일기획 의사결정자)에게 해당되는지, 얼마가 걸렸는지가 원장 사실로 계량됐는가
    anchor_10: 해당 여부와 걸린 크기가 원장(okf/facts) 수치로 계량 완결됐다
    anchor_4: 해당된다는 주장은 있으나 크기를 추정으로 때웠다
    floor:
      score_max: 2
      desc: 좌표 없는 긴박감 — 얼마가 걸렸는지 없이 「중대하다」만 있는 화두

  - id: R2
    name: 함의 실행가능성
    question: 함의 중 최소 1개가 「오늘 내릴 수 있는 판단」인가
    anchor_10: 독자가 오늘 실행할 수 있는 판단형 함의가 존재한다
    anchor_4: 전부 조건부·미래형 — 「~하면 ~해야 한다」「~할 때가 온다」
    floor:
      score_max: 2
      desc: 전원 유보 — 「쌓이면」「드러나면」「재료다」로만 끝나는 함의 목록

  - id: R3
    name: 축 교차
    question: 두 축 이상을 잇는 문장이 있고, 그것이 각 절 단독으로는 못 하는 주장인가
    anchor_10: 교차 명제가 화두급이다 — 그 문장이 지면의 등뼈다
    anchor_4: 주제 우산만 공유하는 병렬 나열 — 절을 섞어도 주장이 안 변한다
    floor:
      score_max: 2
      desc: 교차 문장 0개 — 1~2점

  - id: R4
    name: 새로움
    question: 화두·판단이 전일 호와 논리적으로 독립인가
    anchor_10: 판단 구조까지 새롭다 — 전일 호를 지워도 이 호가 성립한다
    anchor_4: 화두만 바뀌고 판단 구조는 관성이다
    floor: ~   # 전형 사례 미규정 — anchor_4 이하는 심사자 보간

  - id: R5
    name: 근거-주장 정합
    question: 어미 강도가 근거 등급 사다리(1차자료=단정 · 보도=관찰 · 추정=여지)와 맞는가 (insight-guard 6절)
    anchor_10: 전 문장이 사다리를 지킨다
    anchor_4: 화두급 문장에서 어긋난다 — 보도 근거에 단정 어미
    floor: ~

# ─────────────────────────────────────────────
# 2. 임계
# ─────────────────────────────────────────────
threshold:
  value: 7.0        # 시작값 — config review.threshold 가 우선. 이 파일 값은 config 부재 시 기본값
  basis: 3심사자(panel) 평균. 차원 평균 → 심사자 점수 → 3인 평균 순으로 접는다

# ─────────────────────────────────────────────
# 3. 패널 — 3렌즈
# ─────────────────────────────────────────────
# 렌즈는 분업이지 배점 독점이 아니다 — 전 심사자가 5차원 전부를 채점하되,
# 자기 렌즈의 차원에서 발견한 결함은 지적 목록에 반드시 올린다.
panel:
  - id: reader
    name: 독자 렌즈
    focus: [R1, R2]
    desc: 독자(의사결정자)의 자리에서 읽는다 — 나에게 해당되나, 오늘 무엇을 판단할 수 있나
  - id: refuter
    name: 반증 렌즈
    focus: [R5, R1]
    desc: 무담보 탐지 — 근거보다 센 어미, 계량 없는 긴박감을 찾아 무너뜨린다
  - id: crosser
    name: 교차 렌즈
    focus: [R3, R4]
    desc: 축 사이와 호 사이를 본다 — 교차 명제가 실재하나, 전일 호의 관성이 아닌가

# ─────────────────────────────────────────────
# 4. 미달 경로
# ─────────────────────────────────────────────
fail_path:
  - step: 재조판
    rule: 임계 미달이면 지적 목록을 반영해 재조판한다. 1회에 한한다
  - step: 재심사
    rule: 재조판본을 같은 패널이 다시 채점한다. review-form 의 재심사 섹션에 기록
  - step: 발행+보고
    rule: |
      재심사도 미달이면 발행하되 보고에 「정성 미달 N점」을 명기한다.
      매일 나가는 브리핑이다 — 정성 미달은 발행 중단 사유가 아니라 보고 사항이다
      (eval-rubric 머리말과 같은 원칙: 0점인 날에도 방송은 나간다).

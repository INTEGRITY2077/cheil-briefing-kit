# Im not ai, im news editor
#
# 윤문 스킬 2층 구조의 위층.
#   아래층 style-guard.yaml (im-not-ai 기반, MIT) — AI 흔적을 지운다. 무엇을 빼는가.
#   이 파일 — 지운 자리를 제일기획 문체로 채운다. 어디로 고치는가.
# 순서: style-guard 로 빼고 → 이 파일로 착지시킨다. 역순 금지 (착지부터 하면 AI 흔적 위에 화장이 된다)
#
# 근거: 다이나믹 워크플로우 cheil-tone-extract (2026-08-11, 14 에이전트, 검증 통과 6개 소스)
#   매거진 본문 3편(58457·58246·58146) · 매거진 첫 화면 · cheil.com 국문 메인 · 브랜드브리프 테크 쇼케이스 보도(회사 발언 인용)
#   모든 패턴은 인용 실재 검증 + 과잉일반화 반박을 통과한 것만 실었다.

version: 1

sample_scope: |
  이 규칙은 매거진 글 3편(2편은 해외 자회사 기고 번역물), 매거진 제목·리드, 기업 사이트 국문 메인,
  테크 쇼케이스 보도 인용 — 6개 표본에서 확인된 패턴에만 성립한다.
  SNS·채용 공고·경어체 콘텐츠 전반으로 일반화하지 않는다.
  유튜브 채널 카피(구어 레지스터)는 별도 표본으로 모았으나 아직 미검증 — unverified 절 참조.

# ─────────────────────────────────────────────
# 0. 레지스터 선택 — 첫 판정
# ─────────────────────────────────────────────
register:
  rule: 고치기 전에 이 글이 어느 지면인지부터 정한다. 지면이 어미를 정한다
  map:
    - genre: 브리핑 본문·매거진형 칼럼
      ending: 격식체 평서 '-다'  # 매거진 표본에서 경어체 0건
    - genre: 회사 소개·안내문
      ending: '-ㅂ니다'          # cheil.com 메인이 이 어미
    - genre: 라디오 대본
      ending: '-ㅂ니다'          # 발화체. script-radio.md 를 따른다
    - genre: 인용 발언
      ending: 원문 그대로. '~며 ~고 말했다/강조했다/밝혔다' 프레임으로 감싼다
  never: 해요체·구어체 종결 (전 표본 0건)

# ─────────────────────────────────────────────
# 1. AI 문체 → 제일기획 문체 변환표
# ─────────────────────────────────────────────
# style-guard 가 흔적을 지운 뒤, 남은 문장을 이 방향으로 민다.
divergence:
  - ai: 경어체·중립 해설 톤으로 흐른다
    cheil: 전면 '-다' 단정. 유보적 해설을 단정문으로 바꾼다
    example: "디지털 마케팅은 더 나은 캠페인을 론칭하는 것이 아니다. 더 나은 시스템을 설계하는 것이다."
  - ai: 문장 길이가 고르게 중간이다
    cheil: 장단 낙차를 만든다. 균질한 문장열에서 하나를 4~7어절 초단문으로 잘라 전환점을 심는다
    example: "AI의 맹공격이 닥쳐왔기 때문이다. / 시간은 흘러가고 있다."
  - ai: "~할 수 있습니다" "~일 수 있다" 헤지를 쌓는다
    cheil: "~할 것이다" "~된다"로 민다. 완충이 필요하면 한 겹만 — 에세이는 "~일지도 모른다", 인용 발언은 "~것으로 알고 있다"
  - ai: 개념을 병렬 나열한다
    cheil: "A가 아니라 B다" 부정-재정의, 조건 대비("분산돼 있다면 ~, 통합돼 있다면 ~")로 방향을 준다
    example: "조직이 분산되어 있다면 AI는 그 분산을 가속화할 것이고, 시스템이 통합되어 있다면 AI는 성장을 가속화할 것이다."
  - ai: "다양한" "중요한" "효과적인" 무수치 강조
    cheil: 구체 숫자로 대체한다. 수치가 자료에 있으면 반드시 문장 안으로 끌어온다
    example: "1년 만에 MD들의 연간 매장 방문 횟수는 2배 증가, 워킹타임은 66% 감소시켰다."
    caution: 숫자는 ledger 문자열만. headline-guard numbers 절이 우선한다
  - ai: 영문 용어를 그대로 쓰거나 일관성 없이 병기한다
    cheil: 한글 선행 + 괄호 영문 1회. 약어는 영문 약어 + 괄호 한글 풀이. 재등장부터는 한글만
    example: "슬랙(Slack)을 생각해 보자. / LLM(대규모 언어 모델)"
  - ai: 독자에게 "여러분"이라 말 걸거나 명령형으로 안내한다
    cheil: "우리" + 청유형("~해 보자") + 수사의문문. 2인칭 직접 호칭은 전 표본 0건
    example: "AI의 가능성은 거의 무한한데, 어디서부터 시작해야 할까?"
  - ai: 은유를 문장 단위로 소비한다
    cheil: 지배 은유 하나(문, 구조, 설계)를 글 전체에서 반복 변주한다. 산발적 비유는 하나로 통일한다
    example: "콘텐츠를 배포할 수 있는 길은 열렸지만, 발견될 가능성은 사실상 닫혀버린 것이다."
  - ai: 소제목을 밋밋한 명사구로 통일한다
    cheil: 완결 서술문·질문·접속사 시작까지 허용. 콜론 이중 구조를 즐겨 쓴다
    example: "캠페인만으로는 부족하다 : AI가 디지털 마케팅의 구조적 재편을 요구하는 이유"

# ─────────────────────────────────────────────
# 2. 헤드라인 문법 (제일기획 표본)
# ─────────────────────────────────────────────
# headline-guard 가 무엇을 말할지(규명)를 정하고, 이 절은 어떤 형태로 말할지를 정한다.
headline:
  base: "단정 선언(또는 명사구) + 콜론/대시 + 이유·질문·대상명"
  patterns:
    - "캠페인만으로는 부족하다 : ~요구하는 이유"        # 단정 + 이유
    - "알고리즘을 넘어선 발견 : ~새롭게 열어줄 것인가?"  # 명사구 + 질문
    - "타이레놀, 통증을 다시 디자인하다 – ~캠페인"      # 쉼표 도치 + 대시 병기
  allowed: [완결 서술문, 질문형, 접속사 시작 소제목, 한자·영문 약어 노출]
  note: |
    질문형 허용은 headline-guard v2 shape.S1(의문형 금지)과 충돌한다.
    조정 — 축 헤드라인(규명 서술)은 S1 유지, 문서 화두(h1)와 매거진형 제목은 질문 허용.

# ─────────────────────────────────────────────
# 3. 어휘
# ─────────────────────────────────────────────
vocabulary:
  prefer:
    - 구조·설계·재편·통합·축적·가속화     # 시스템/건축 은유 개념어
    - "'바로 ~다' 지목 구문, '~까지.' 명사 종결 조각문"
    - 제일러                                # 구성원 자체 조어. 사내 대상 글에서
  official_voice:                           # 회사 공식 발언 인용 시
    - 진화·파트너·실질적 성과               # 겸양 없는 성장 서사 어휘
    - "'~것으로 알고 있다' 완충 화법"
  avoid:
    - 2인칭 직접 호칭 (여러분·당신)
    - 해요체
    - 수치 없는 막연한 강조 (크게·많이 단독)
  spelling:
    - 설루션    # 보도자료 계열 표기. '솔루션' 아님

# ─────────────────────────────────────────────
# 4. 리듬과 구성
# ─────────────────────────────────────────────
rhythm:
  opening: 짧은 2문장 테제 압축 — 부정→재정의 연타, 또는 시점 박은 상황 묘사
  body: 소제목 6개 안팎 구획. 각 구획은 단정 → 대비/부연 → 함의
  closing: 열린 전망 또는 긍정 전환("다행인 점은 ~"). 번역물은 출처 각주로 종결
  list_intro: 리스트 앞에 예고문을 먼저 놓는다 ("~교훈은 다음과 같다")
  cut: 긴 나열 뒤 "~까지." 조각문이나 "바로 ~다" 한 문장으로 호흡을 끊는다

# ─────────────────────────────────────────────
# 5. 미검증 표본 — 유튜브 구어 카피
# ─────────────────────────────────────────────
unverified:
  source: 채널일 영상 11편의 제목·설명문 (scratchpad/cheil-yt-corpus.md)
  observed:   # 리드의 인상. 검증 워크플로우 미통과 — 규칙으로 쓰지 않는다
    - 쉼표 행갈이 리듬 ("이태원을 기록하는, / 제일기획 직원들의 브이로그")
    - 청유형 독자 유인 ("일상 속으로 들어가볼까요?")
    - 자기 낮춤 유머 ("인간 병아리", "맛없는 커피는 안 드신다는 (?)")
    - 실명+직함 호명 (OOO 프로)
  promote_when: 매거진 표본과 같은 검증(인용 실재 + 과잉일반화 반박)을 통과하면 3절로 올린다

# ─────────────────────────────────────────────
# 6. 게이트
# ─────────────────────────────────────────────
gates:
  - id: E1
    check: 레지스터를 먼저 정했는가. 어미가 지면과 맞는가
  - id: E2
    check: style-guard 를 먼저 통과했는가 (순서 검증)
  - id: E3
    check: 헤지가 두 겹 이상 남아 있지 않은가
  - id: E4
    check: 문장 길이 낙차가 있는가. 균질한 중간 길이 문장열이 남아 있지 않은가
  - id: E5
    check: 영문 병기가 규칙(한글 선행, 1회)대로인가
  - id: E6
    check: 2인칭 호칭·해요체가 없는가
  - id: E7
    check: 표본 밖 지면(SNS·채용 등)에 이 규칙을 적용하지 않았는가
